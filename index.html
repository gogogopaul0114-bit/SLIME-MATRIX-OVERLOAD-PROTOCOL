            dashDirX: 0, dashDirY: 0, ghostSpawnTimer: 0,
            isMeleeing: false, meleeTimer: 0, meleeCooldown: 0, meleeCooldownMax: 0.42, meleeAngle: 0, meleeRangeMult: 1.0,
            isGuarding: false, guardTimer: 0, guardAngle: 0,
            chargeTimer: 0, chargeMax: 0.68,
            overheat: 0, maxOverheat: 100, isOverheated: false, overheatCooldown: 0,
            isUltimate: false, ultimateTimer: 0, levelUpTimer: 0,

            // 16 節點彈簧質點柔體物理陣列
            softRadius: new Float32Array(SOFT_NODE_COUNT),
            softVel: new Float32Array(SOFT_NODE_COUNT),
            softWorldCoords: new Float32Array(SOFT_NODE_COUNT * 2),
            bubbles: Array.from({ length: 6 }, () => ({
                angle: Math.random() * Math.PI * 2,
                dist: 3 + Math.random() * 9,
                r: 1.5 + Math.random() * 2.2,
                speed: 1.2 + Math.random() * 1.8
            })),

            eyeBlinkTimer: 3.2, isBlinking: false,
            teleportCooldown: 0,
            orbitalAngle: 0,
            solarAuraTimer: 0,

            atkMult: 1.0, spdMult: 1.0, heatMult: 1.0, coolMult: 1.0, droneCount: 1,
            activePerks: [],
            activeSynergies: [],

            hasPerk(id) { return this.activePerks.includes(id); },
            hasSynergy(id) { return this.activeSynergies.includes(id); },

            initSoftBody() {
                for (let i = 0; i < SOFT_NODE_COUNT; i++) {
                    this.softRadius[i] = 20;
                    this.softVel[i] = 0;
                }
            },

            injectSoftBodyImpulse(worldAngle, strength) {
                for (let i = 0; i < SOFT_NODE_COUNT; i++) {
                    const nodeAngle = (i / SOFT_NODE_COUNT) * Math.PI * 2;
                    let diff = nodeAngle - worldAngle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    // 前方拉伸、側方收縮 (體積守恆果凍效應)
                    const align = Math.cos(diff * 2);
                    this.softVel[i] += align * strength;
                }
            },

            updateSoftBody(dt, vx, vy) {
                const restR = 20.5;
                const kRadial = 195.0;
                const kNeighbor = 95.0;
                const damping = Math.exp(-8.5 * dt);

                const moveSpeed = Math.hypot(vx, vy);
                const moveAngle = moveSpeed > 10 ? Math.atan2(vy, vx) : 0;

                for (let i = 0; i < SOFT_NODE_COUNT; i++) {
                    const prevIdx = (i + SOFT_NODE_COUNT - 1) % SOFT_NODE_COUNT;
                    const nextIdx = (i + 1) % SOFT_NODE_COUNT;
                    const nodeAngle = (i / SOFT_NODE_COUNT) * Math.PI * 2;

                    // 移動慣性形變目標
                    let targetR = restR;
                    if (moveSpeed > 25) {
                        const stretchFactor = Math.min(4.8, moveSpeed * 0.0085);
                        targetR += Math.cos((nodeAngle - moveAngle) * 2) * stretchFactor;
                    }

                    const fRadial = (targetR - this.softRadius[i]) * kRadial;
                    const fNeighbor = ((this.softRadius[prevIdx] - this.softRadius[i]) + (this.softRadius[nextIdx] - this.softRadius[i])) * kNeighbor;

                    this.softVel[i] = (this.softVel[i] + (fRadial + fNeighbor) * dt) * damping;
                }

                for (let i = 0; i < SOFT_NODE_COUNT; i++) {
                    this.softRadius[i] = Math.max(12.5, Math.min(31.0, this.softRadius[i] + this.softVel[i] * dt));
                    const nodeAngle = (i / SOFT_NODE_COUNT) * Math.PI * 2;
                    this.softWorldCoords[i * 2] = this.x + Math.cos(nodeAngle) * this.softRadius[i];
                    this.softWorldCoords[i * 2 + 1] = this.y + Math.sin(nodeAngle) * this.softRadius[i];
                }

                for (let b = 0; b < this.bubbles.length; b++) {
                    this.bubbles[b].angle += this.bubbles[b].speed * dt;
                }
            },

            setElement(el) {
                if (!metaSave.unlockedCores.includes(el)) {
                    showNotification("CORE LOCKED — UNLOCK IN GODCORE LAB!", 1600);
                    return;
                }
                if (this.element !== el && (!this.isOverheated || this.hasPerk('overheat_core'))) {
                    this.element = el;
                    playSound('switch', { x: this.x });
                    spawnParticles(this.x, this.y, this.getElementColor(), 2.6, 12);
                    this.injectSoftBodyImpulse(0, 140);
                }
            },

            getElementColor() {
                if (this.element === 1) return '#ff4400';
                if (this.element === 2) return '#00d5ff';
                if (this.element === 3) return '#c300ff';
                return '#00ffcc';
            },

            getBulletColor() {
                if (this.element === 1) return '#ffaa00';
                if (this.element === 2) return '#aaddff';
                if (this.element === 3) return '#ff66ff';
                return '#ffea00';
            },

            levelUp() {
                this.level++;
                this.exp -= this.maxExp;
                this.maxExp = Math.floor(this.maxExp * 1.42);
                this.levelUpTimer = 1.0;
                playSound('level_up');
                triggerHitStop(0.18, 22);
                spawnParticles(this.x, this.y, '#ffff00', 3.4, 28);
                addShockwave(this.x, this.y, 260, 'rgba(255, 255, 0, 0.95)', 1.2);
                rollPerks();
                gameState = 'levelup';
            },

            addSp(amount) {
                this.sp = Math.min(this.maxSp, this.sp + amount);
            },

            addHeat(amount) {
                if (this.element === 0) return;
                if (this.isOverheated && !this.hasPerk('overheat_core')) return;
                this.overheat += (amount * this.heatMult);
                if (this.overheat >= 100) {
                    this.overheat = 100;
                    this.isOverheated = true;
                    this.overheatCooldown = 3.2;
                    if (!this.hasPerk('overheat_core')) this.element = 0;
                    playSound('explode', { x: this.x });
                    chromaticAberration = Math.max(chromaticAberration, 1.0);
                    spawnFloatingText(this.x, this.y - 45, this.hasPerk('overheat_core') ? "GODCORE HYPERCLOCK!" : "REACTOR OVERLOAD!", "#ff0044", true);
                    triggerHitStop(0.08, 14);
                }
            },

            getEffectiveAtkMult() {
                let m = this.atkMult;
                if (this.hasPerk('berserk_core')) {
                    const missingRatio = 1.0 - (this.hp / this.maxHp);
                    m += missingRatio * 0.65;
                }
                if (this.isOverheated && this.hasPerk('overheat_core')) {
                    m += 0.35;
                }
                return m;
            },

            update(dt) {
                this.eyeBlinkTimer -= dt;
                if (this.eyeBlinkTimer <= 0) {
                    this.isBlinking = true;
                    if (this.eyeBlinkTimer < -0.15) {
                        this.isBlinking = false;
                        this.eyeBlinkTimer = 2.6 + Math.random() * 3.4;
                    }
                }

                if (keyJustPressed['Digit1']) this.setElement(0);
                if (keyJustPressed['Digit2']) this.setElement(1);
                if (keyJustPressed['Digit3']) this.setElement(2);
                if (keyJustPressed['Digit4']) this.setElement(3);

                if (this.isOverheated) {
                    this.overheatCooldown -= dt;
                    this.overheat = Math.max(0, (this.overheatCooldown / 3.2) * 100);
                    if (this.overheatCooldown <= 0) {
                        this.isOverheated = false;
                        this.overheat = 0;
                        spawnFloatingText(this.x, this.y - 35, "REACTOR STABILIZED", "#00ffcc");
                    }
                } else {
                    const coolRate = (this.element === 0 ? 44 : 19) * this.coolMult;
                    this.overheat = Math.max(0, this.overheat - coolRate * dt);
                }

                if (this.invulnTimer > 0) this.invulnTimer -= dt;
                if (this.levelUpTimer > 0) this.levelUpTimer -= dt;
                if (this.teleportCooldown > 0) this.teleportCooldown -= dt;
                this.knockX *= Math.pow(0.08, dt);
                this.knockY *= Math.pow(0.08, dt);
                if (this.dashCooldown > 0) this.dashCooldown -= dt;
                if (this.meleeCooldown > 0) this.meleeCooldown -= dt;

                // 環繞等離子衛星更新
                if (this.hasPerk('orbital_blades')) {
                    this.orbitalAngle += dt * 4.5;
                    for (let b = 0; b < 2; b++) {
                        const ang = this.orbitalAngle + b * Math.PI;
                        const bx = this.x + Math.cos(ang) * 68;
                        const by = this.y + Math.sin(ang) * 68;
                        const near = enemyGrid.query(bx, by, 35);
                        for (let k = 0; k < near.length; k++) {
                            const e = near[k];
                            if (!e.isSpawning && Math.hypot(e.x - bx, e.y - by) < e.width * 0.5 + 16) {
                                const sawDmg = 18 * this.getEffectiveAtkMult() * dt;
                                e.hp -= sawDmg;
                                totalDamageDealt += sawDmg;
                                if (Math.random() < 0.25) spawnParticles(bx, by, this.getElementColor(), 1.2, 2);
                            }
                        }
                    }
                }

                // 太陽風暴化身超進化光環
                if (this.hasSynergy('solar_flare_incarnation')) {
                    this.solarAuraTimer -= dt;
                    if (this.solarAuraTimer <= 0) {
                        this.solarAuraTimer = 0.25;
                        const near = enemyGrid.query(this.x, this.y, 130);
                        for (let k = 0; k < near.length; k++) {
                            const e = near[k];
                            if (!e.isSpawning && Math.hypot(e.x - this.x, e.y - this.y) < 130) {
                                e.burnTimer = 3.5;
                                const dmg = 5.5 * this.getEffectiveAtkMult();
                                e.hp -= dmg;
                                totalDamageDealt += dmg;
                                spawnParticles(e.x, e.y, '#ff5500', 1.4, 3);
                            }
                        }
                    }
                }

                let dx = 0; let dy = 0;
                if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
                if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) dx += 1;

                if (touchInput.moveActive) {
                    dx = touchInput.moveDx;
                    dy = touchInput.moveDy;
                } else if (dx !== 0 && dy !== 0) {
                    const len = Math.hypot(dx, dy);
                    dx /= len; dy /= len;
                }

                // 檢查腳下加速墊、冰面滑行與雙向蟲洞傳送門
                const currentTile = getTile(this.x, this.y);
                let terrainSpeedMult = 1.0;
                if (currentTile.type === 7) {
                    terrainSpeedMult = 1.55;
                    if (Math.random() < 0.3) spawnParticles(this.x, this.y, '#00ffcc', 1.2, 2);
                }
                for (let cz = 0; cz < cryoZones.length; cz++) {
                    if (Math.hypot(this.x - cryoZones[cz].x, this.y - cryoZones[cz].y) < cryoZones[cz].radius) {
                        terrainSpeedMult = Math.max(terrainSpeedMult, 1.32);
                        break;
                    }
                }

                if ((currentTile.type === 8 || currentTile.type === 9) && this.teleportCooldown <= 0) {
                    const targetType = currentTile.type === 8 ? 9 : 8;
                    for (let r = 0; r < MAP_ROWS; r++) {
                        for (let c = 0; c < MAP_COLS; c++) {
                            if (mapData[r][c] === targetType) {
                                playSound('teleport', { x: this.x });
                                spawnParticles(this.x, this.y, '#c300ff', 3, 18);
                                this.x = c * TILE_SIZE + 32;
                                this.y = r * TILE_SIZE + 32;
                                spawnParticles(this.x, this.y, '#c300ff', 3, 18);
                                addShockwave(this.x, this.y, 220, 'rgba(195, 0, 255, 0.9)', 1.2);
                                this.teleportCooldown = 2.0;
                                spawnFloatingText(this.x, this.y - 30, "QUANTUM WARP!", "#c300ff", true);
                                break;
                            }
                        }
                    }
                }

                // 終結大招 (Singularity Omnislash)
                if (this.isUltimate) {
                    this.ultimateTimer -= dt;
                    this.invulnTimer = 0.15;
                    camera.targetZoom = 1.26;

                    const hasZeroSingularity = this.hasSynergy('absolute_zero_singularity');
                    const radius = (this.hasPerk('singularity_blade') || hasZeroSingularity) ? 265 : 185;
                    const near = enemyGrid.query(this.x, this.y, radius);

                    for (let i = 0; i < near.length; i++) {
                        const e = near[i];
                        if (e.isSpawning) continue;
                        const dist = Math.hypot(e.x - this.x, e.y - this.y) || 0.001;
                        if (dist < radius) {
                            if (this.hasPerk('singularity_blade') || hasZeroSingularity) {
                                moveEntity(e, ((this.x - e.x) / dist) * 340, ((this.y - e.y) / dist) * 340, dt);
                            }
                            if (hasZeroSingularity) e.chillTimer = 4.5;
                            if (Math.random() > 0.35) {
                                const dmg = (5.5 + this.level * 1.8) * this.getEffectiveAtkMult();
                                e.hp -= dmg;
                                totalDamageDealt += dmg;
                                e.flashTimer = 0.12;
                                e.knockX = ((e.x - this.x) / dist) * 420;
                                e.knockY = ((e.y - this.y) / dist) * 420;
                                spawnParticles(e.x, e.y, hasZeroSingularity ? '#00d5ff' : '#ff00ff', 2.4, 4);
                                addCombo();
                                playSound('hit', { x: e.x });
                                this.applyElementalStatus(e);
                            }
                        }
                    }

                    if (this.ultimateTimer <= 0) {
                        this.isUltimate = false;
                        camera.targetZoom = 1.0;
                    }
                    this.updateSoftBody(dt, 0, 0);
                    return;
                } else if (keys['KeyE'] && this.sp >= this.maxSp) {
                    this.isUltimate = true;
                    this.ultimateTimer = 1.4;
                    this.sp = 0;
                    playSound('ultimate', { x: this.x });
                    triggerHitStop(0.18, 26);
                    chromaticAberration = 1.2;
                    addShockwave(this.x, this.y, 340, 'rgba(255, 0, 255, 0.95)', 1.5);
                    spawnFloatingText(this.x, this.y - 45, "SINGULARITY OMNISLASH!", "#ff00ff", true);
                    return;
                }

                // 格擋判定
                this.isGuarding = keys['ShiftLeft'] && !this.isDashing && !this.isMeleeing && !this.isUltimate;
                if (this.isGuarding) {
                    this.guardTimer += dt;
                    const wm = getWorldMousePos();
                    this.guardAngle = Math.atan2(wm.y - this.y, wm.x - this.x);
                    dx *= 0.28; dy *= 0.28;
                    this.chargeTimer = 0;
                } else {
                    this.guardTimer = 0;
                }

                // 近戰光刃揮斬 (右鍵)
                if (this.isMeleeing) {
                    this.meleeTimer -= dt;
                    if (this.meleeTimer <= 0) this.isMeleeing = false;
                } else if (mouse.isRightDown && this.meleeCooldown <= 0 && !this.isDashing && !this.isGuarding) {
                    this.performMelee();
                    this.chargeTimer = 0;
                } else if (keys['Space'] && this.dashCooldown <= 0 && !this.isDashing && !this.isGuarding) {
                    this.isDashing = true;
                    this.dashTimer = this.dashDuration;
                    this.dashCooldown = this.dashCooldownMax;
                    playSound('dash', { x: this.x });
                    this.addHeat(7);

                    if (dx === 0 && dy === 0) {
                        const wm = getWorldMousePos();
                        const angle = Math.atan2(wm.y - this.y, wm.x - this.x);
                        this.dashDirX = Math.cos(angle);
                        this.dashDirY = Math.sin(angle);
                    } else {
                        this.dashDirX = dx;
                        this.dashDirY = dy;
                    }
                    this.injectSoftBodyImpulse(Math.atan2(this.dashDirY, this.dashDirX), 260);
                    this.invulnTimer = 0.25;
                    this.chargeTimer = 0;

                    if (this.hasPerk('chronos_step')) {
                        triggerBulletTime(0.35);
                        createExplosion(this.x, this.y, 90, 12 * this.getEffectiveAtkMult(), this.element || 3);
                    }
                }

                // 移動與柔體節點更新
                let activeVx = 0, activeVy = 0;
                const finalSpeed = this.baseSpeed * this.spdMult * terrainSpeedMult * (this.hasPerk('berserk_core') ? (1 + (1 - this.hp / this.maxHp) * 0.35) : 1);
                if (this.isDashing) {
                    this.dashTimer -= dt;
                    const curDashSpeed = this.dashSpeed * this.spdMult;
                    activeVx = this.dashDirX * curDashSpeed;
                    activeVy = this.dashDirY * curDashSpeed;
                    moveEntity(this, activeVx, activeVy, dt);

                    this.ghostSpawnTimer += dt;
                    if (this.ghostSpawnTimer > 0.022) {
                        ghostPool.spawn({ x: this.x, y: this.y, life: 0.26, color: this.getElementColor(), nodes: this.softWorldCoords });
                        this.ghostSpawnTimer = 0;
                    }

                    if (this.hasPerk('flame_trail')) {
                        const trailRadius = this.hasSynergy('solar_flare_incarnation') ? 34 : 22;
                        slimeTrails.push({
                            x: this.x, y: this.y,
                            radius: trailRadius, life: 3.0, maxLife: 3.0,
                            element: 1, damage: 2.2 * this.getEffectiveAtkMult()
                        });
                    }

                    if (this.dashTimer <= 0) this.isDashing = false;
                } else if (!this.isMeleeing) {
                    activeVx = dx * finalSpeed + this.knockX;
                    activeVy = dy * finalSpeed + this.knockY;
                    moveEntity(this, activeVx, activeVy, dt);
                }
                this.updateSoftBody(dt, activeVx, activeVy);

                // 自動輔助瞄準 (若開啟)
                if (userSettings.autoAimAssist && enemies.length > 0 && !touchInput.aimActive) {
                    let bestTarget = null;
                    let minD = 540;
                    for (let i = 0; i < enemies.length; i++) {
                        const e = enemies[i];
                        if (e.isSpawning) continue;
                        const d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minD) { minD = d; bestTarget = e; }
                    }
                    if (bestTarget) {
                        const sx = (bestTarget.x - camera.x - WIDTH / 2) * camera.zoom + WIDTH / 2;
                        const sy = (bestTarget.y - camera.y - HEIGHT / 2) * camera.zoom + HEIGHT / 2;
                        mouse.x += (sx - mouse.x) * 0.25;
                        mouse.y += (sy - mouse.y) * 0.25;
                    }
                }

                // 蓄力射擊控制 (左鍵)
                const fireDelay = (this.isOverheated && this.hasPerk('overheat_core')) ? (this.fireRate * 0.62) : this.fireRate;
                if (this.fireCooldown > 0) this.fireCooldown -= dt;
                if (mouse.isLeftDown && !this.isDashing && !this.isMeleeing && !this.isGuarding) {
                    this.chargeTimer += dt;
                    if (this.chargeTimer > this.chargeMax) this.chargeTimer = this.chargeMax;
                } else if (!mouse.isLeftDown && this.chargeTimer > 0) {
                    if (this.chargeTimer >= this.chargeMax) {
                        this.shoot(true);
                    } else if (this.fireCooldown <= 0) {
                        this.shoot(false);
                    }
                    this.chargeTimer = 0;
                    this.fireCooldown = fireDelay;
                }
            },

            applyElementalStatus(enemy, overrideElement = null) {
                const el = overrideElement !== null ? overrideElement : this.element;
                if (el === 1) {
                    if (enemy.burnTimer > 0 && this.chargeTimer >= this.chargeMax) {
                        // 熱 + 熱 = 熔毀反應
                        enemy.burnTimer = 5.0;
                        const meltDmg = 12 * this.getEffectiveAtkMult();
                        enemy.hp -= meltDmg;
                        totalDamageDealt += meltDmg;
                        spawnFloatingText(enemy.x, enemy.y - 26, "THERMAL MELTDOWN!", "#ff6600", true);
                    } else {
                        enemy.burnTimer = 3.8;
                    }
                } else if (el === 2) {
                    enemy.chillTimer = 3.8;
                } else if (el === 3) {
                    if (enemy.stunTimer > 0) {
                        // 電 + 電 = 自動電弧跳躍
                        triggerChainLightning(enemy.x, enemy.y, enemy, 2, 9 * this.getEffectiveAtkMult());
                    }
                    enemy.stunTimer = 1.8;
                    spawnParticles(enemy.x, enemy.y, '#c300ff', 2.2, 6);
                    if (this.hasPerk('chain_lightning')) {
                        triggerChainLightning(enemy.x, enemy.y, enemy, 4, 13 * this.getEffectiveAtkMult());
                    }
                }
            },

            // 六向元素反應核心結算引擎
            resolveElementalReaction(target, attackElement, baseDmg, isChargedKinetic = false) {
                const catMult = this.hasPerk('elemental_catalyst') ? 1.5 : 1.0;
                let finalDmg = baseDmg;

                // 1. 熱 + 冰 = 閃蒸爆裂 (Flash Vaporize: 2.5x 真實傷害 + 致盲蒸氣雲)
                if ((attackElement === 2 && target.burnTimer > 0) || (attackElement === 1 && target.chillTimer > 0)) {
                    finalDmg *= (2.5 * catMult);
                    target.burnTimer = 0;
                    target.chillTimer = 0;
                    spawnFloatingText(target.x, target.y - 34, "FLASH VAPORIZE! 2.5x", "#ffcc00", true);
                    addShockwave(target.x, target.y, 150, 'rgba(255, 220, 120, 0.9)', 1.1);
                    steamClouds.push({ x: target.x, y: target.y, radius: 115, life: 5.5 });
                }
                // 2. 電 + 冰 = 超導碎甲 (Superconduct Shatter: 永久破甲 +40% 易傷 + 6 枚冰晶飛刺)
                else if ((attackElement === 3 && target.chillTimer > 0) || (attackElement === 2 && target.stunTimer > 0)) {
                    finalDmg *= (2.2 * catMult);
                    target.chillTimer = 0;
                    target.stunTimer = Math.max(target.stunTimer, 2.0);
                    target.shattered = true;
                    spawnFloatingText(target.x, target.y - 34, "SUPERCONDUCT SHATTER!", "#00ffff", true);
                    for (let k = 0; k < 6; k++) {
                        const ang = (k / 6) * Math.PI * 2;
                        bulletPool.spawn({
                            x: target.x, y: target.y,
                            vx: Math.cos(ang) * 860, vy: Math.sin(ang) * 860,
                            radius: 5.5, color: '#aaddff', bounces: 1,
                            isEnemy: false, element: 2, isPiercing: true, damageMult: 0.75
                        });
                    }
                }
                // 3. 熱 + 電 = 超新星過載 (Supernova Overload: 大範圍等離子爆炸 + 強擊退)
                else if ((attackElement === 1 && target.stunTimer > 0) || (attackElement === 3 && target.burnTimer > 0)) {
                    finalDmg *= (2.1 * catMult);
                    target.burnTimer = 0;
                    target.stunTimer = 0;
                    spawnFloatingText(target.x, target.y - 34, "SUPERNOVA OVERLOAD!", "#ff0066", true);
                    createExplosion(target.x, target.y, 165, finalDmg * 0.85, 3);
                }
                // 4. 動能蓄力彈 + 任意異常狀態 = 諧振引爆 (Resonance Detonation: 結算剩餘異常並擴散至周圍敵人)
                else if (isChargedKinetic && (target.burnTimer > 0 || target.chillTimer > 0 || target.stunTimer > 0)) {
                    const spreadEl = target.burnTimer > 0 ? 1 : (target.chillTimer > 0 ? 2 : 3);
                    const bonus = (target.burnTimer + target.chillTimer + target.stunTimer) * 4.5 * catMult;
                    finalDmg += bonus;
                    target.burnTimer = 0; target.chillTimer = 0; target.stunTimer = 0;
                    spawnFloatingText(target.x, target.y - 34, "RESONANCE DETONATION!", "#00ffcc", true);
                    addShockwave(target.x, target.y, 195, 'rgba(0, 255, 204, 0.95)', 1.3);

                    const neighbors = enemyGrid.query(target.x, target.y, 160);
                    for (let i = 0; i < neighbors.length; i++) {
                        const nb = neighbors[i];
                        if (nb !== target && !nb.isSpawning && Math.hypot(nb.x - target.x, nb.y - target.y) <= 160) {
                            this.applyElementalStatus(nb, spreadEl);
                            nb.hp -= bonus * 0.65;
                            totalDamageDealt += bonus * 0.65;
                        }
                    }
                }

                if (target.shattered) finalDmg *= 1.4;
                return finalDmg;
            },

            performMelee() {
                this.isMeleeing = true;
                this.meleeTimer = 0.22;
                this.meleeCooldown = this.meleeCooldownMax;
                playSound('melee', { x: this.x });
                this.addHeat(14);

                const wm = getWorldMousePos();
                this.meleeAngle = Math.atan2(wm.y - this.y, wm.x - this.x);
                this.injectSoftBodyImpulse(this.meleeAngle, 210);
                let hitSomething = false;
                const reach = 128 * this.meleeRangeMult;

                const near = enemyGrid.query(this.x, this.y, reach + 50);
                for (let i = 0; i < near.length; i++) {
                    const e = near[i];
                    if (e.isSpawning) continue;
                    const ex = e.x - this.x;
                    const ey = e.y - this.y;
                    const dist = Math.hypot(ex, ey) || 0.001;
                    const angleToEnemy = Math.atan2(ey, ex);
                    let angleDiff = angleToEnemy - this.meleeAngle;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

                    if (dist < reach + e.width * 0.35 && Math.abs(angleDiff) < (165 / 180 * Math.PI) / 2) {
                        if (e.type === 'juggernaut') {
                            let diff = Math.abs(angleToEnemy - e.facingAngle);
                            while (diff > Math.PI) diff = Math.PI * 2 - diff;
                            if (diff < Math.PI / 2.4) {
                                playSound('parry', { x: e.x });
                                this.knockX = -Math.cos(this.meleeAngle) * 380;
                                this.knockY = -Math.sin(this.meleeAngle) * 380;
                                spawnFloatingText(e.x, e.y, "SHIELD DEFLECTION", "#aaa");
                                continue;
                            }
                        }

                        if (this.hasPerk('executioner') && e.type !== 'boss' && e.type !== 'hydra' && (e.hp / e.maxHp) < 0.28) {
                            e.hp = 0;
                            spawnFloatingText(e.x, e.y - 20, "TERMINAL EXECUTION!", "#ff0033", true);
                            triggerHitStop(0.16, 20);
                            createExplosion(e.x, e.y, 115, 16 * this.getEffectiveAtkMult(), 1);
                            continue;
                        }

                        let hitDiff = Math.abs(angleToEnemy - e.facingAngle);
                        while (hitDiff > Math.PI) hitDiff = Math.PI * 2 - hitDiff;
                        const isBackstab = hitDiff < Math.PI / 2.5;
                        let dmg = (8.5 + this.level * 1.45) * this.getEffectiveAtkMult();

                        dmg = this.resolveElementalReaction(e, this.element, dmg, this.element === 0);

                        if (isBackstab) {
                            dmg = Math.floor(dmg * 1.6);
                            spawnFloatingText(e.x, e.y - 18, "BACKSTAB CRIT!", "#ffff00", true);
                        }

                        if (this.hasPerk('frost_nova') && e.chillTimer > 0) {
                            for (let k = 0; k < 8; k++) {
                                const angle = (k / 8) * Math.PI * 2;
                                bulletPool.spawn({
                                    x: e.x, y: e.y,
                                    vx: Math.cos(angle) * 800,
                                    vy: Math.sin(angle) * 800,
                                    radius: 6, color: '#aaddff', bounces: 1,
                                    isEnemy: false, element: 2, isPiercing: true
                                });
                            }
                        }

                        e.hp -= dmg;
                        totalDamageDealt += dmg;
                        e.flashTimer = 0.2;
                        if (e.type === 'boss' || e.type === 'hydra' || e.type === 'seraph') {
                            e.stagger = (e.stagger || 0) + 14;
                        }
                        e.knockX = Math.cos(this.meleeAngle) * 860;
                        e.knockY = Math.sin(this.meleeAngle) * 860;
                        spawnParticles(e.x, e.y, this.getElementColor(), 3.2, 12);
                        spawnFloatingText(e.x, e.y, Math.floor(dmg), this.getElementColor(), isBackstab);
                        this.applyElementalStatus(e);
                        hitSomething = true;
                        this.addSp(18);
                        addCombo();
                        playSound('hit', { x: e.x });

                        if (this.element === 1) {
                            createExplosion(e.x, e.y, 95, (7 + this.level) * this.getEffectiveAtkMult(), 1);
                        }
                    }
                }

                // 場景互動方塊破壞/觸發判定
                for (let step = 45; step <= reach; step += 35) {
                    const targetTile = getTile(this.x + Math.cos(this.meleeAngle) * step, this.y + Math.sin(this.meleeAngle) * step);
                    if (targetTile.type === 2) { breakCrate(targetTile.col, targetTile.row); hitSomething = true; this.addSp(6); }
                    else if (targetTile.type === 5) { explodeBarrel(targetTile.col, targetTile.row); hitSomething = true; }
                    else if (targetTile.type === 6) { destroyEMPPylon(targetTile.col, targetTile.row); hitSomething = true; }
                    else if (targetTile.type === 10) { detonateCryoCanister(targetTile.col, targetTile.row); hitSomething = true; }
                    else if (targetTile.type === 11) { triggerPlasmaConduitGrid(targetTile.col, targetTile.row); hitSomething = true; }
                    else if (targetTile.type === 3) { triggerSwitch(targetTile.col, targetTile.row); hitSomething = true; }
                }

                if (hitSomething) triggerHitStop(0.055, 15);
            },

            shoot(isCharged) {
                const wm = getWorldMousePos();
                playSound(isCharged ? 'charge_shoot' : 'shoot', { x: this.x });
                const dx = wm.x - this.x;
                const dy = wm.y - (this.y - 6);
                const len = Math.hypot(dx, dy) || 0.001;
                const baseAngle = Math.atan2(dy, dx);
                this.addHeat(isCharged ? 16 : 4);
                this.injectSoftBodyImpulse(baseAngle + Math.PI, isCharged ? 195 : 85);

                const speedMult = (this.hasPerk('rapid_injector') ? 1.2 : 1.0) * (this.hasPerk('rail_affinity') ? 1.35 : 1.0);
                const baseBounces = (isCharged ? 5 : 3) + (this.hasPerk('bouncing_bullets') ? 2 : 0);
                const isPiercing = isCharged || this.hasPerk('pierce_burst');
                const baseRadius = (isCharged ? 16 : 7) * (isCharged && this.hasPerk('quick_charge') ? 1.3 : 1.0);

                // 彈殼拋出貼花
                stampDecal('casing', this.x + (Math.random() - 0.5) * 18, this.y + 12, 4, Math.random() * Math.PI);

                const spawnProjectile = (ang, rScale = 1.0, dmgMult = 1.0, elOverride = null) => {
                    const spd = (isCharged ? 1320 : 1020) * speedMult;
                    bulletPool.spawn({
                        x: this.x,
                        y: this.y - 6,
                        vx: Math.cos(ang) * spd,
                        vy: Math.sin(ang) * spd,
                        radius: baseRadius * rScale,
                        color: elOverride !== null ? ['#ffea00','#ffaa00','#aaddff','#ff66ff'][elOverride] : this.getBulletColor(),
                        bounces: baseBounces,
                        isEnemy: false,
                        element: elOverride !== null ? elOverride : this.element,
                        isPiercing: isPiercing,
                        isHoming: isCharged && this.element === 0,
                        damageMult: dmgMult
                    });
                };

                // 神核無限反應爐超進化：過熱三向光束
                if (this.isOverheated && this.hasSynergy('godcore_hyper_reactor')) {
                    spawnProjectile(baseAngle - 0.14, 1.15, 1.15);
                    spawnProjectile(baseAngle, 1.25, 1.25);
                    spawnProjectile(baseAngle + 0.14, 1.15, 1.15);
                } else if (isCharged && this.hasPerk('prism_matrix')) {
                    // 四象稜鏡蓄力齊射
                    spawnProjectile(baseAngle - 0.11, 0.9, 0.85, 1);
                    spawnProjectile(baseAngle, 1.15, 1.1, 3);
                    spawnProjectile(baseAngle + 0.11, 0.9, 0.85, 2);
                } else {
                    spawnProjectile(baseAngle, 1.0, 1.0);
                    if (this.hasPerk('split_shot') && !isCharged) {
                        spawnProjectile(baseAngle + (Math.random() > 0.5 ? 0.16 : -0.16), 0.8, 0.72);
                    }
                }

                if (isCharged) {
                    triggerScreenShake(12);
                    triggerHitStop(0.045, 12);
                    this.knockX = -(dx / len) * 560;
                    this.knockY = -(dy / len) * 560;
                } else {
                    triggerScreenShake(2.2);
                }
            },

            drawSoftContour(ctx, coords) {
                ctx.beginPath();
                const n = SOFT_NODE_COUNT;
                for (let i = 0; i < n; i++) {
                    const currX = coords[i * 2];
                    const currY = coords[i * 2 + 1];
                    const nextIdx = (i + 1) % n;
                    const nextX = coords[nextIdx * 2];
                    const nextY = coords[nextIdx * 2 + 1];
                    const midX = (currX + nextX) * 0.5;
                    const midY = (currY + nextY) * 0.5;
                    if (i === 0) {
                        const prevX = coords[(n - 1) * 2];
                        const prevY = coords[(n - 1) * 2 + 1];
                        ctx.moveTo((prevX + currX) * 0.5, (prevY + currY) * 0.5);
                    }
                    ctx.quadraticCurveTo(currX, currY, midX, midY);
                }
                ctx.closePath();
            },

            draw(ctx, timestamp) {
                drawShadow(ctx, this.x, this.y, 44);

                // --- 本我環形戰術 UI (Diegetic World-Space HUD) ---
                ctx.save();
                ctx.translate(this.x, this.y + 4);
                // 1. 衝刺充能弧線 (底部左側)
                const dashReadyRatio = Math.max(0, Math.min(1, 1 - this.dashCooldown / this.dashCooldownMax));
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.arc(0, 0, 34, Math.PI * 0.62, Math.PI * 0.95);
                ctx.stroke();

                ctx.strokeStyle = dashReadyRatio >= 0.99 ? '#00ffcc' : '#008877';
                ctx.beginPath();
                ctx.arc(0, 0, 34, Math.PI * 0.62, Math.PI * 0.62 + (Math.PI * 0.33) * dashReadyRatio);
                ctx.stroke();

                // 2. 反應爐熱能弧線 (底部右側)
                if (this.overheat > 1) {
                    const heatRatio = Math.min(1, this.overheat / 100);
                    ctx.strokeStyle = this.isOverheated ? '#ff0044' : '#ff6600';
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, 34, Math.PI * 0.05, Math.PI * 0.05 + (Math.PI * 0.33) * heatRatio);
                    ctx.stroke();
                }

                // 3. 完美格擋黃金判定窗提示環
                if (this.isGuarding && this.guardTimer < 0.34) {
                    ctx.strokeStyle = 'rgba(255, 225, 60, 0.85)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, -4, 46 - this.guardTimer * 25, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();

                // 太陽風暴化身超進化光環視覺
                if (this.hasSynergy('solar_flare_incarnation')) {
                    ctx.save();
                    ctx.strokeStyle = `rgba(255, 90, 0, ${0.28 + Math.sin(timestamp / 90) * 0.12})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 128, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 環繞等離子衛星繪製
                if (this.hasPerk('orbital_blades')) {
                    for (let b = 0; b < 2; b++) {
                        const ang = this.orbitalAngle + b * Math.PI;
                        const bx = this.x + Math.cos(ang) * 68;
                        const by = this.y + Math.sin(ang) * 68;
                        ctx.save();
                        ctx.translate(bx, by);
                        ctx.rotate(timestamp / 35);
                        ctx.fillStyle = this.getElementColor();
                        ctx.beginPath();
                        for (let t = 0; t < 6; t++) {
                            const ta = (t / 6) * Math.PI * 2;
                            const r = t % 2 === 0 ? 15 : 6;
                            if (t === 0) ctx.moveTo(Math.cos(ta) * r, Math.sin(ta) * r);
                            else ctx.lineTo(Math.cos(ta) * r, Math.sin(ta) * r);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }

                if (this.invulnTimer > 0) {
                    ctx.globalAlpha = 0.38 + Math.abs(Math.sin(timestamp / 40)) * 0.62;
                }

                if (this.levelUpTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 48 + (1 - this.levelUpTimer) * 58, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 255, 0, ${this.levelUpTimer})`;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }

                if (this.chargeTimer > 0) {
                    const ratio = this.chargeTimer / this.chargeMax;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 62 - ratio * 30, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 240, 120, ${ratio})`;
                    ctx.lineWidth = 2 + ratio * 4;
                    ctx.stroke();
                }

                // 終結大招漩渦
                if (this.isUltimate) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(timestamp / 45);
                    ctx.beginPath();
                    ctx.arc(0, 0, 175, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 0, 255, ${0.45 + Math.random() * 0.45})`;
                    ctx.lineWidth = 10 + Math.random() * 14;
                    ctx.stroke();
                    ctx.fillStyle = `rgba(255, 0, 255, 0.2)`;
                    ctx.fill();
                    ctx.restore();
                }

                // --- 16 節點柔體史萊姆本體渲染 ---
                const baseColor = this.isDashing ? '#ffffff' : (this.chargeTimer >= this.chargeMax && Math.floor(timestamp / 50) % 2 === 0 ? '#ffffff' : this.getElementColor());
                ctx.save();
                this.drawSoftContour(ctx, this.softWorldCoords);
                ctx.fillStyle = baseColor;
                ctx.fill();

                // 半透明果凍內部深度漸層
                const bodyGrad = ctx.createRadialGradient(this.x - 5, this.y - 6, 2, this.x, this.y, 26);
                bodyGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
                bodyGrad.addColorStop(0.65, 'rgba(255, 255, 255, 0.08)');
                bodyGrad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
                ctx.fillStyle = bodyGrad;
                ctx.fill();

                // 內部脈動神核 (Nucleus)
                const nucPulse = 6.5 + Math.sin(timestamp / 110) * 1.5;
                const nucGrad = ctx.createRadialGradient(this.x, this.y + 3, 1, this.x, this.y + 3, nucPulse * 1.6);
                nucGrad.addColorStop(0, '#ffffff');
                nucGrad.addColorStop(0.5, baseColor);
                nucGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = nucGrad;
                ctx.beginPath();
                ctx.arc(this.x, this.y + 3, nucPulse * 1.6, 0, Math.PI * 2);
                ctx.fill();

                // 內部懸浮能量氣泡
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                for (let b = 0; b < this.bubbles.length; b++) {
                    const bub = this.bubbles[b];
                    const bx = this.x + Math.cos(bub.angle) * bub.dist;
                    const by = this.y + Math.sin(bub.angle) * bub.dist;
                    ctx.beginPath();
                    ctx.arc(bx, by, bub.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 菲涅爾邊緣高光 (Fresnel Rim Light)
                this.drawSoftContour(ctx, this.softWorldCoords);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                // 立體轉動雙眼
                if (!this.isUltimate) {
                    const wm = getWorldMousePos();
                    const lookAngle = Math.atan2(wm.y - this.y, wm.x - this.x);
                    const eyeOffsetX = Math.cos(lookAngle) * 4.2;
                    const eyeOffsetY = Math.sin(lookAngle) * 4.2;

                    if (!this.isBlinking) {
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath(); ctx.ellipse(this.x - 7.5 + eyeOffsetX * 0.35, this.y - 3 + eyeOffsetY * 0.35, 4.8, 6.2, 0, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.ellipse(this.x + 7.5 + eyeOffsetX * 0.35, this.y - 3 + eyeOffsetY * 0.35, 4.8, 6.2, 0, 0, Math.PI * 2); ctx.fill();

                        ctx.fillStyle = '#071019';
                        ctx.beginPath(); ctx.arc(this.x - 7.5 + eyeOffsetX, this.y - 3 + eyeOffsetY, 2.6, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(this.x + 7.5 + eyeOffsetX, this.y - 3 + eyeOffsetY, 2.6, 0, Math.PI * 2); ctx.fill();

                        // 眼神高光點
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath(); ctx.arc(this.x - 8.3 + eyeOffsetX, this.y - 4.2 + eyeOffsetY, 1.0, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(this.x + 6.7 + eyeOffsetX, this.y - 4.2 + eyeOffsetY, 1.0, 0, Math.PI * 2); ctx.fill();
                    } else {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2.4;
                        ctx.beginPath();
                        ctx.moveTo(this.x - 11, this.y - 3); ctx.lineTo(this.x - 4, this.y - 3);
                        ctx.moveTo(this.x + 4, this.y - 3); ctx.lineTo(this.x + 11, this.y - 3);
                        ctx.stroke();
                    }
                }

                // 近戰刀刃揮斬弧光 & 格擋力場盾牌
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.isMeleeing) {
                    ctx.rotate(this.meleeAngle);
                    ctx.beginPath();
                    const progress = 1 - (this.meleeTimer / 0.22);
                    const reachR = (92 + progress * 24) * this.meleeRangeMult;
                    ctx.arc(0, 0, reachR, -Math.PI / 2.1, Math.PI / 2.1);
                    ctx.lineWidth = 20 - progress * 15;
                    ctx.strokeStyle = this.getElementColor();
                    ctx.globalAlpha = this.meleeTimer / 0.22;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                } else if (this.isGuarding) {
                    ctx.rotate(this.guardAngle);
                    ctx.beginPath();
                    const parryWindow = this.hasPerk('parry_master') ? 0.42 : 0.28;
                    ctx.arc(0, 0, 42, -Math.PI / 2.8, Math.PI / 2.8);
                    ctx.strokeStyle = this.guardTimer < parryWindow ? '#ffffff' : this.getElementColor();
                    ctx.lineWidth = this.guardTimer < parryWindow ? 9 : 5;
                    ctx.stroke();
                }
                ctx.restore();
                ctx.globalAlpha = 1.0;
            }
        };

        // =====================================================================
        //  九、死神支援僚機與天基軌道電漿網超進化
        // =====================================================================
        class DroneUnit {
            constructor(id) {
                this.id = id;
                this.x = 96; this.y = 96;
                this.angle = id * (Math.PI * 2 / 3);
                this.fireCooldown = 0;
            }
            update(dt) {
                this.angle += dt * 2.5;
                const activeCount = player.hasPerk('drone_mk2') ? Math.max(2, player.droneCount) : player.droneCount;
                const offsetDist = 54;
                const phaseOffset = (this.id / activeCount) * Math.PI * 2;
                const targetX = player.x + Math.cos(this.angle + phaseOffset) * offsetDist;
                const targetY = player.y + Math.sin(this.angle + phaseOffset) * offsetDist - 22;
                this.x += (targetX - this.x) * 7.0 * dt;
                this.y += (targetY - this.y) * 7.0 * dt;

                this.fireCooldown -= dt;
                const isAutoFire = player.hasPerk('drone_mk2') || player.isUltimate;
                const fireInterval = player.isUltimate ? 0.08 : 0.4;

                if (this.fireCooldown <= 0 && enemies.length > 0 && isAutoFire) {
                    let closest = null;
                    let minDist = 420;
                    const cands = enemyGrid.query(this.x, this.y, minDist);
                    for (let i = 0; i < cands.length; i++) {
                        const e = cands[i];
                        if (e.isSpawning) continue;
                        const d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minDist) { minDist = d; closest = e; }
                    }

                    if (closest) {
                        const angleToTarget = Math.atan2(closest.y - this.y, closest.x - this.x);
                        bulletPool.spawn({
                            x: this.x, y: this.y,
                            vx: Math.cos(angleToTarget) * 1240,
                            vy: Math.sin(angleToTarget) * 1240,
                            radius: 4.5,
                            color: player.isUltimate ? '#ff00ff' : player.getElementColor(),
                            bounces: 1,
                            isEnemy: false,
                            element: player.element,
                            isPiercing: player.isUltimate,
                            damageMult: 0.75
                        });
                        this.fireCooldown = fireInterval;
                        playSound('drone_shoot', { x: this.x });
                    }
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * 2.2);
                ctx.fillStyle = player.getElementColor();
                ctx.fillRect(-7, -7, 14, 14);
                ctx.fillStyle = '#fff';
                ctx.fillRect(-2, -2, 4, 4);
                ctx.restore();
            }
        }

        const drones = [new DroneUnit(0), new DroneUnit(1), new DroneUnit(2)];

        function updateAndDrawOrbitalTeslaWeb(ctx, dt, timestamp) {
            if (!player.hasSynergy('orbital_tesla_web')) return;
            const activeCount = player.hasPerk('drone_mk2') ? Math.max(2, player.droneCount) : player.droneCount;
            if (activeCount < 2) return;

            const nodes = [{ x: player.x, y: player.y }];
            for (let i = 0; i < activeCount; i++) nodes.push({ x: drones[i].x, y: drones[i].y });

            ctx.save();
            ctx.strokeStyle = `rgba(195, 0, 255, ${0.65 + Math.sin(timestamp / 60) * 0.25})`;
            ctx.lineWidth = 3.5;

            for (let i = 0; i < nodes.length; i++) {
                const a = nodes[i];
                const b = nodes[(i + 1) % nodes.length];
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                const mx = (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 12;
                const my = (a.y + b.y) * 0.5 + (Math.random() - 0.5) * 12;
                ctx.lineTo(mx, my);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();

                // 切割線上的敵人
                for (let k = 0; k < enemies.length; k++) {
                    const e = enemies[k];
                    if (e.isSpawning) continue;
                    if (pointToSegmentDist(e.x, e.y, a.x, a.y, b.x, b.y) < e.width * 0.5 + 10) {
                        const webDmg = 24 * player.getEffectiveAtkMult() * dt;
                        e.hp -= webDmg;
                        totalDamageDealt += webDmg;
                        e.stunTimer = Math.max(e.stunTimer, 0.35);
                    }
                }
            }
            ctx.restore();
        }

        // =====================================================================
        //  十、敵群 AI、分離轉向 (SEPARATION) 與三大史詩多階段 BOSS 輪替
        // =====================================================================
        let gameState = 'start';
        let activeModal = null; // null | 'lab' | 'codex' | 'settings'
        let codexTab = 'reactions'; // 'reactions' | 'enemies' | 'synergies'
        let wave = 0;
        const enemies = [];

        function spawnNextWave() {
            // 每通關 5 波（第 6, 11, 16... 波開局）觸發矩陣重構動態競技場！
            if (wave > 0 && wave % 5 === 0) {
                generateProceduralArena((wave / 5) % 4);
                // 將玩家安全安置於左上出生區
                const safePos = findNearestWalkablePoint(128, 128, player.width, player.height);
                player.x = safePos.x;
                player.y = safePos.y;
            }

            wave++;
            waveAnnounceTimer = 2.4;
            playSound('level_up');

            if (player.hasPerk('reactive_shield')) {
                player.shield = player.maxShield;
            }
            if (player.hasPerk('nano_plating') && wave > 1) {
                player.hp = Math.min(player.maxHp, player.hp + 1);
                player.shield = Math.min(player.maxShield, player.shield + 1);
            }

            // 每 5 波依序輪替三大史詩多階段 Boss
            if (wave % 5 === 0) {
                const bossCycle = ((wave / 5) - 1) % 3;
                const cx = MAP_WIDTH * 0.5;
                const cy = MAP_HEIGHT * 0.5;
                camera.targetZoom = 0.84;

                if (bossCycle === 0) {
                    // Wave 5: TITAN OMEGA (攻城無畏艦)
                    const sp = findNearestWalkablePoint(cx, cy, 92, 92);
                    const hp = 110 + wave * 26;
                    enemies.push({
                        x: sp.x, y: sp.y, width: 92, height: 92,
                        type: 'boss', bossArchetype: 'omega', bossName: 'TITAN OMEGA',
                        speed: 78, hp, maxHp: hp, color: '#ff0044',
                        flashTimer: 0, knockX: 0, knockY: 0,
                        fireCooldown: 2.0, isSpawning: true, spawnTimer: 2.0,
                        burnTimer: 0, chillTimer: 0, stunTimer: 0, shattered: false,
                        laserWarnTimer: 0, laserFireTimer: 0, laserAngle: 0,
                        facingAngle: 0, phase: 1, stagger: 0, maxStagger: 100, staggerBrokenTimer: 0
                    });
                    showNotification("WARNING: TITAN OMEGA SIEGE DREADNOUGHT DETECTED!", 3600);
                } else if (bossCycle === 1) {
                    // Wave 10: CHRONO-HYDRA (時空雙生蛇 - 雙核心獨立血條，5秒內須雙殺否則互相復活)
                    const hp = 85 + wave * 20;
                    const spA = findNearestWalkablePoint(cx - 170, cy, 68, 68);
                    const spB = findNearestWalkablePoint(cx + 170, cy, 68, 68);
                    const hydraGroupId = Date.now();
                    [
                        { pos: spA, role: 'ALPHA', color: '#00ffcc' },
                        { pos: spB, role: 'OMEGA', color: '#ff00aa' }
                    ].forEach((cfg, idx) => {
                        enemies.push({
                            x: cfg.pos.x, y: cfg.pos.y, width: 68, height: 68,
                            type: 'boss', bossArchetype: 'hydra', bossName: `CHRONO-HYDRA [${cfg.role}]`,
                            hydraGroupId, hydraRole: cfg.role, hydraDownTimer: 0,
                            speed: 115, hp, maxHp: hp, color: cfg.color,
                            flashTimer: 0, knockX: 0, knockY: 0,
                            fireCooldown: 1.5 + idx * 0.7, isSpawning: true, spawnTimer: 2.0,
                            burnTimer: 0, chillTimer: 0, stunTimer: 0, shattered: false,
                            chronoFieldTimer: 4.0 + idx * 2.0,
                            facingAngle: 0, phase: 1, stagger: 0, maxStagger: 85, staggerBrokenTimer: 0
                        });
                    });
                    showNotification("WARNING: CHRONO-HYDRA TWIN CORES — DESTROY BOTH WITHIN 5S!", 4000);
                } else {
                    // Wave 15+: SINGULARITY SERAPH (奇異點熾天使 - 萬花筒彈幕、隕石彈弓、全屏次元斬)
                    const sp = findNearestWalkablePoint(cx, cy, 86, 86);
                    const hp = 145 + wave * 30;
                    enemies.push({
                        x: sp.x, y: sp.y, width: 86, height: 86,
                        type: 'boss', bossArchetype: 'seraph', bossName: 'SINGULARITY SERAPH',
                        speed: 92, hp, maxHp: hp, color: '#ffcc00',
                        flashTimer: 0, knockX: 0, knockY: 0,
                        fireCooldown: 1.6, isSpawning: true, spawnTimer: 2.0,
                        burnTimer: 0, chillTimer: 0, stunTimer: 0, shattered: false,
                        riftSlashTimer: 4.5, riftLines: [], meteorAngle: 0,
                        facingAngle: 0, phase: 1, stagger: 0, maxStagger: 110, staggerBrokenTimer: 0
                    });
                    showNotification("APEX ALERT: SINGULARITY SERAPH DESCENDS!", 3800);
                }

                playSound('explode');
                triggerScreenShake(20);
                return;
            }

            camera.targetZoom = 1.0;
            const spawnCount = 4 + wave * 2;
            const allowedTypes = ['melee', 'shooter'];
            if (wave >= 2) allowedTypes.push('juggernaut');
            if (wave >= 3) { allowedTypes.push('swarm'); allowedTypes.push('infiltrator'); }
            if (wave >= 4) { allowedTypes.push('mortar'); allowedTypes.push('healer'); }

            let spawned = 0;
            let attempts = 0;
            while (spawned < spawnCount && attempts < 200) {
                attempts++;
                const c = 1 + Math.floor(Math.random() * (MAP_COLS - 2));
                const r = 1 + Math.floor(Math.random() * (MAP_ROWS - 2));
                if (isWalkableTile(mapData[r][c])) {
                    const ex = c * TILE_SIZE + TILE_SIZE * 0.5;
                    const ey = r * TILE_SIZE + TILE_SIZE * 0.5;
                    if (Math.hypot(ex - player.x, ey - player.y) > 360) {
                        const type = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];
                        createEnemy(ex, ey, type);
                        spawned++;
                    }
                }
            }
        }

        function createEnemy(x, y, type) {
            let hp = 4.5 + wave * 1.1;
            let speed = 122 + Math.random() * 28;
            let color = '#ff3366';
            let width = 36;
            let height = 36;

            if (type === 'juggernaut') {
                hp = 15 + wave * 2.9;
                speed = 58;
                color = '#00ffff';
                width = 44; height = 44;
            } else if (type === 'shooter') {
                hp = 3.5 + wave;
                speed = 90;
                color = '#3399ff';
            } else if (type === 'swarm') {
                hp = 2 + Math.floor(wave * 0.5);
                speed = 185;
                color = '#00ff88';
                width = 24; height = 24;
            } else if (type === 'mortar') {
                hp = 7.5 + wave * 1.1;
                speed = 66;
                color = '#ffaa00';
                width = 40; height = 40;
            } else if (type === 'infiltrator') {
                hp = 5.5 + wave;
                speed = 148;
                color = '#aa00ff';
                width = 32; height = 32;
            } else if (type === 'healer') {
                hp = 8.5 + wave;
                speed = 92;
                color = '#00ff99';
                width = 34; height = 34;
            }

            enemies.push({
                x, y, width, height, type, speed, hp, maxHp: hp,
                color, flashTimer: 0, knockX: 0, knockY: 0,
                fireCooldown: 1.0 + Math.random() * 2,
                isSpawning: true, spawnTimer: 1.15,
                burnTimer: 0, chillTimer: 0, stunTimer: 0, shattered: false,
                facingAngle: 0,
                invisTimer: type === 'infiltrator' ? 3.0 : 0,
                healCooldown: type === 'healer' ? 2.5 : 0
            });
        }

        // =====================================================================
        //  十一、遊戲狀態重置與 UI 互動導航
        // =====================================================================
        function resetGame() {
            mapData = JSON.parse(JSON.stringify(initialMapData));
            clearDecals();
            cryoZones.length = 0;
            steamClouds.length = 0;

            const hpBonus = metaSave.upgrades.hpLevel;
            const atkBonus = metaSave.upgrades.atkLevel * 0.1;
            const dashCdBonus = Math.pow(0.93, metaSave.upgrades.dashLevel);
            const spdBonus = metaSave.upgrades.dashLevel * 0.05;
            const coolBonus = metaSave.upgrades.coolLevel * 0.15;
            const heatRed = Math.pow(0.90, metaSave.upgrades.coolLevel);
            const shieldBonus = metaSave.upgrades.shieldLevel;

            player.x = 110; player.y = 110;
            player.maxHp = 6 + hpBonus;
            player.hp = player.maxHp;
            player.maxShield = 3 + shieldBonus;
            player.shield = shieldBonus;
            player.level = 1; player.exp = 0; player.maxExp = 75;
            player.sp = 0; player.maxSp = 80;
            player.overheat = 0; player.isOverheated = false;
            player.element = metaSave.unlockedCores.includes(metaSave.selectedStartCore) ? metaSave.selectedStartCore : 0;
            player.activePerks = [];
            player.activeSynergies = [];
            player.atkMult = 1.0 + atkBonus;
            player.spdMult = 1.0 + spdBonus;
            player.heatMult = heatRed;
            player.coolMult = 1.0 + coolBonus;
            player.fireRate = 0.13;
            player.chargeMax = 0.68;
            player.dashCooldownMax = 0.5 * dashCdBonus;
            player.meleeCooldownMax = 0.42;
            player.meleeRangeMult = 1.0;
            player.droneCount = 1;
            player.initSoftBody();

            enemies.length = 0;
            bulletPool.clear();
            particlePool.clear();
            ghostPool.clear();
            floatingTextPool.clear();
            shockwaves.clear();
            drops.length = 0;
            explosions.length = 0;
            slimeTrails.length = 0;
            lightningBolts.length = 0;

            wave = 0;
            perkRerolls = 2;
            comboCount = 0;
            comboTimer = 0;
            hitStop = 0;
            screenShake = 0;
            chromaticAberration = 0;
            slowMoTimer = 0;
            bossFinisherTimer = 0;
            waveAnnounceTimer = 0;
            arenaTransitionTimer = 0;
            synergyBannerTimer = 0;
            totalKills = 0;
            totalDamageDealt = 0;
            runShardsEarned = 0;

            metaSave.totalRuns++;
            writeSaveData();

            gameState = 'playing';
            activeModal = null;
            spawnNextWave();
            showNotification("PROTOCOL INITIALIZED — SURVIVE THE MATRIX!");
        }

        function finalizeRunSave() {
            if (wave > metaSave.bestWave) metaSave.bestWave = wave;
            if (totalKills > metaSave.bestKills) metaSave.bestKills = totalKills;
            const rankBonus = getRank() ? 15 : 0;
            const earned = Math.floor(totalKills * 1.5 + wave * 8 + rankBonus);
            runShardsEarned = earned;
            metaSave.shards += earned;
            writeSaveData();
        }

        function getWorldMousePos() {
            return {
                x: (mouse.x - WIDTH / 2) / camera.zoom + WIDTH / 2 + camera.x,
                y: (mouse.y - HEIGHT / 2) / camera.zoom + HEIGHT / 2 + camera.y
            };
        }

        function handlePointerInteraction() {
            if (activeModal) {
                handleModalClick();
                return;
            }

            if (gameState === 'start') {
                initAudio();
                // 檢查開始畫面按鈕點擊區域
                // 1. [LAUNCH PROTOCOL] 主啟動按鈕
                if (mouse.x >= WIDTH / 2 - 190 && mouse.x <= WIDTH / 2 + 190 && mouse.y >= 445 && mouse.y <= 505) {
                    resetGame();
                    if (!isBgmPlaying) toggleBGM();
                    return;
                }
                // 2. [GODCORE LAB] 神核實驗室
                if (mouse.x >= WIDTH / 2 - 270 && mouse.x <= WIDTH / 2 - 95 && mouse.y >= 525 && mouse.y <= 575) {
                    activeModal = 'lab';
                    playSound('switch');
                    return;
                }
                // 3. [TACTICAL CODEX] 戰術圖鑑
                if (mouse.x >= WIDTH / 2 - 85 && mouse.x <= WIDTH / 2 + 85 && mouse.y >= 525 && mouse.y <= 575) {
                    activeModal = 'codex';
                    playSound('switch');
                    return;
                }
                // 4. [SETTINGS] 系統設定
                if (mouse.x >= WIDTH / 2 + 95 && mouse.x <= WIDTH / 2 + 270 && mouse.y >= 525 && mouse.y <= 575) {
                    activeModal = 'settings';
                    playSound('switch');
                    return;
                }
                return;
            }

            if (gameState === 'paused') {
                // 暫停畫面按鈕點擊判定
                if (mouse.x >= WIDTH / 2 - 150 && mouse.x <= WIDTH / 2 + 150) {
                    if (mouse.y >= 340 && mouse.y <= 390) {
                        gameState = 'playing';
                        return;
                    }
                    if (mouse.y >= 405 && mouse.y <= 455) {
                        activeModal = 'settings';
                        return;
                    }
                    if (mouse.y >= 470 && mouse.y <= 520) {
                        resetGame();
                        return;
                    }
                }
                // 點擊畫布空白處亦可直接恢復戰鬥
                gameState = 'playing';
                return;
            }

            if (gameState === 'gameover') {
                if (mouse.x >= WIDTH / 2 - 190 && mouse.x <= WIDTH / 2 + 190 && mouse.y >= 510 && mouse.y <= 565) {
                    resetGame();
                } else if (mouse.x >= WIDTH / 2 - 190 && mouse.x <= WIDTH / 2 + 190 && mouse.y >= 580 && mouse.y <= 630) {
                    gameState = 'start';
                }
                return;
            }

            if (gameState === 'levelup') {
                if (mouse.hoverCardIndex >= 0 && mouse.hoverCardIndex < offeredPerks.length) {
                    applyPerk(offeredPerks[mouse.hoverCardIndex]);
                } else if (perkRerolls > 0 && mouse.x >= WIDTH / 2 - 130 && mouse.x <= WIDTH / 2 + 130 && mouse.y >= 585 && mouse.y <= 630) {
                    perkRerolls--;
                    rollPerks();
                    playSound('switch');
                }
            }
        }

        function handleModalClick() {
            // 右上角關閉按鈕 [X]
            if (mouse.x >= WIDTH - 135 && mouse.x <= WIDTH - 75 && mouse.y >= 65 && mouse.y <= 115) {
                activeModal = null;
                playSound('switch');
                return;
            }

            if (activeModal === 'lab') {
                const upgradeKeys = ['hpLevel', 'atkLevel', 'dashLevel', 'coolLevel', 'shieldLevel', 'shardLevel'];
                const maxLevels = [5, 5, 5, 5, 3, 5];
                const baseCosts = [30, 40, 35, 35, 50, 30];

                for (let i = 0; i < upgradeKeys.length; i++) {
                    const col = i % 2;
                    const row = Math.floor(i / 2);
                    const bx = 110 + col * 415;
                    const by = 185 + row * 112;
                    if (mouse.x >= bx && mouse.x <= bx + 390 && mouse.y >= by && mouse.y <= by + 95) {
                        const k = upgradeKeys[i];
                        const curLv = metaSave.upgrades[k];
                        const cost = baseCosts[i] * (curLv + 1);
                        if (curLv < maxLevels[i] && metaSave.shards >= cost) {
                            metaSave.shards -= cost;
                            metaSave.upgrades[k]++;
                            writeSaveData();
                            playSound('powerup');
                            showNotification("GENE MATRIX ENHANCED!");
                        } else {
                            playSound('hit');
                        }
                        return;
                    }
                }

                // 初始元素核心解鎖與切換 (4 顆按鈕)
                const coreCosts = [0, 80, 80, 100];
                for (let c = 0; c < 4; c++) {
                    const cx = 110 + c * 205;
                    const cy = 560;
                    if (mouse.x >= cx && mouse.x <= cx + 190 && mouse.y >= cy && mouse.y <= cy + 75) {
                        if (metaSave.unlockedCores.includes(c)) {
                            metaSave.selectedStartCore = c;
                            writeSaveData();
                            playSound('switch');
                        } else if (metaSave.shards >= coreCosts[c]) {
                            metaSave.shards -= coreCosts[c];
                            metaSave.unlockedCores.push(c);
                            metaSave.selectedStartCore = c;
                            writeSaveData();
                            playSound('synergy');
                            showNotification("NEW ELEMENTAL CORE UNLOCKED!");
                        }
                        return;
                    }
                }
            } else if (activeModal === 'codex') {
                const tabs = ['reactions', 'enemies', 'synergies'];
                for (let t = 0; t < 3; t++) {
                    const tx = 130 + t * 260;
                    if (mouse.x >= tx && mouse.x <= tx + 230 && mouse.y >= 135 && mouse.y <= 178) {
                        codexTab = tabs[t];
                        playSound('switch');
                        return;
                    }
                }
            } else if (activeModal === 'settings') {
                // 滑桿與開關點擊判定
                if (mouse.x >= 440 && mouse.x <= 780) {
                    const ratio = Math.max(0, Math.min(1, (mouse.x - 440) / 340));
                    if (mouse.y >= 195 && mouse.y <= 235) { userSettings.shakeScale = ratio * 1.5; playSound('switch'); }
                    else if (mouse.y >= 260 && mouse.y <= 300) { userSettings.bgmVolume = ratio; updateAudioVolumes(); }
                    else if (mouse.y >= 325 && mouse.y <= 365) { userSettings.sfxVolume = ratio; updateAudioVolumes(); playSound('shoot'); }
                }
                if (mouse.x >= 440 && mouse.x <= 620) {
                    if (mouse.y >= 395 && mouse.y <= 435) { userSettings.hitStopEnabled = !userSettings.hitStopEnabled; playSound('switch'); }
                    else if (mouse.y >= 455 && mouse.y <= 495) { userSettings.autoAimAssist = !userSettings.autoAimAssist; playSound('switch'); }
                    else if (mouse.y >= 515 && mouse.y <= 555) { userSettings.showTelemetry = !userSettings.showTelemetry; playSound('switch'); }
                }
            }
        }

        function togglePause() {
            if (gameState === 'playing') gameState = 'paused';
            else if (gameState === 'paused') gameState = 'playing';
        }

        // =====================================================================
        //  十二、固定時間步長物理管線 (120Hz FIXED-TIMESTEP) 與主迴圈
        // =====================================================================
        const FIXED_DT = 1 / 120;
        let physicsAccumulator = 0;
        let lastTime = 0;
        let fpsCounter = 60;
        let fpsFrames = 0;
        let fpsTimer = 0;

        function stepFixedPhysics(dt, timestamp) {
            if (dt <= 0) return;

            // 更新空間雜湊網格
            enemyGrid.clear();
            for (let i = 0; i < enemies.length; i++) {
                if (!enemies[i].isSpawning) enemyGrid.insert(enemies[i]);
            }

            player.update(dt);
            const activeDrones = player.hasPerk('drone_mk2') ? Math.max(2, player.droneCount) : player.droneCount;
            for (let d = 0; d < activeDrones; d++) drones[d].update(dt);
            camera.update(player);

            if (enemies.length === 0 && bossFinisherTimer <= 0) spawnNextWave();

            // 冰面區與蒸氣雲生命期
            for (let i = cryoZones.length - 1; i >= 0; i--) {
                cryoZones[i].life -= dt;
                if (cryoZones[i].life <= 0) cryoZones.splice(i, 1);
            }
            for (let i = steamClouds.length - 1; i >= 0; i--) {
                steamClouds[i].life -= dt;
                if (steamClouds[i].life <= 0) steamClouds.splice(i, 1);
            }

            // 史萊姆熔岩路徑
            for (let i = slimeTrails.length - 1; i >= 0; i--) {
                const tr = slimeTrails[i];
                tr.life -= dt;
                const near = enemyGrid.query(tr.x, tr.y, tr.radius + 30);
                for (let k = 0; k < near.length; k++) {
                    const e = near[k];
                    if (Math.hypot(e.x - tr.x, e.y - tr.y) < tr.radius + e.width * 0.5) {
                        e.burnTimer = 2.4;
                        e.hp -= tr.damage * dt;
                        totalDamageDealt += tr.damage * dt;
                    }
                }
                if (tr.life <= 0) slimeTrails.splice(i, 1);
            }

            // 敵群狀態、軟碰撞分離 (Separation) 與 Boss 多階段 AI
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.isSpawning) {
                    e.spawnTimer -= dt;
                    if (e.spawnTimer <= 0) {
                        e.isSpawning = false;
                        spawnParticles(e.x, e.y, e.color, 2.2, 12);
                        playSound('hit', { x: e.x });
                    }
                    continue;
                }

                // 時空雙生蛇 (CHRONO-HYDRA) 假死復活讀秒檢查
                if (e.bossArchetype === 'hydra' && e.hydraDownTimer > 0) {
                    e.hydraDownTimer -= dt;
                    // 檢查另一條核心是否還活著
                    let partnerAlive = false;
                    for (let j = 0; j < enemies.length; j++) {
                        if (j !== i && enemies[j].hydraGroupId === e.hydraGroupId && enemies[j].hydraDownTimer <= 0 && enemies[j].hp > 0) {
                            partnerAlive = true;
                            break;
                        }
                    }
                    if (!partnerAlive) {
                        // 雙殺成功！徹底消滅
                        e.hp = 0;
                    } else if (e.hydraDownTimer <= 0) {
                        // 重生！
                        e.hp = Math.floor(e.maxHp * 0.5);
                        addShockwave(e.x, e.y, 200, e.color, 1.2);
                        spawnFloatingText(e.x, e.y - 30, "TEMPORAL RESURRECTION!", e.color, true);
                        playSound('teleport', { x: e.x });
                    } else {
                        continue;
                    }
                }

                if (e.flashTimer > 0) e.flashTimer -= dt;

                // 架勢條破防狀態 (Boss Stagger)
                let staggerDmgMult = 1.0;
                if (e.staggerBrokenTimer > 0) {
                    e.staggerBrokenTimer -= dt;
                    staggerDmgMult = 2.0;
                } else if (e.stagger >= e.maxStagger) {
                    e.stagger = 0;
                    e.staggerBrokenTimer = 3.5;
                    playSound('emp', { x: e.x });
                    triggerHitStop(0.16, 22);
                    addShockwave(e.x, e.y, 260, 'rgba(255, 220, 0, 0.95)', 1.3);
                    spawnFloatingText(e.x, e.y - 45, "STAGGER BROKEN! 2.0x DMG!", "#ffcc00", true);
                }

                let currentSpeed = e.staggerBrokenTimer > 0 ? 0 : e.speed;
                if (e.burnTimer > 0) {
                    e.burnTimer -= dt;
                    if (Math.random() < 0.08) {
                        const burnTick = 0.85 * (e.shattered ? 1.4 : 1.0);
                        e.hp -= burnTick;
                        totalDamageDealt += burnTick;
                        spawnParticles(e.x, e.y, "#ff4400", 0.6, 1);
                    }
                }
                if (e.chillTimer > 0) {
                    e.chillTimer -= dt;
                    currentSpeed *= 0.45;
                }
                for (let cz = 0; cz < cryoZones.length; cz++) {
                    if (Math.hypot(e.x - cryoZones[cz].x, e.y - cryoZones[cz].y) < cryoZones[cz].radius) {
                        currentSpeed *= 0.55;
                        break;
                    }
                }
                if (e.stunTimer > 0) {
                    e.stunTimer -= dt;
                    currentSpeed = 0;
                }

                // 檢查是否位於致盲蒸氣雲內
                let inSteam = false;
                for (let sc = 0; sc < steamClouds.length; sc++) {
                    if (Math.hypot(e.x - steamClouds[sc].x, e.y - steamClouds[sc].y) < steamClouds[sc].radius) {
                        inSteam = true;
                        currentSpeed *= 0.7;
                        break;
                    }
                }

                // 幽靈刺客：螺旋/BFS 安全瞬移至玩家背後 (絕不卡牆)
                if (e.type === 'infiltrator' && currentSpeed > 0) {
                    e.invisTimer -= dt;
                    if (e.invisTimer <= -2.6) {
                        playSound('teleport', { x: e.x });
                        spawnParticles(e.x, e.y, '#aa00ff', 2.2, 10);
                        const wm = getWorldMousePos();
                        const playerFacing = Math.atan2(wm.y - player.y, wm.x - player.x);
                        const desiredX = player.x - Math.cos(playerFacing) * 95;
                        const desiredY = player.y - Math.sin(playerFacing) * 95;
                        const safeSpot = findNearestWalkablePoint(desiredX, desiredY, e.width, e.height);
                        e.x = safeSpot.x;
                        e.y = safeSpot.y;
                        spawnParticles(e.x, e.y, '#aa00ff', 2.2, 10);
