                        e.invisTimer = 3.6;
                    }
                }

                // 奈米維修機
                if (e.type === 'healer' && currentSpeed > 0) {
                    e.healCooldown -= dt;
                    if (e.healCooldown <= 0) {
                        const allies = enemyGrid.query(e.x, e.y, 185);
                        for (let a = 0; a < allies.length; a++) {
                            const other = allies[a];
                            if (other !== e && !other.isSpawning && Math.hypot(other.x - e.x, other.y - e.y) < 185) {
                                other.hp = Math.min(other.maxHp, other.hp + 4.5);
                                spawnParticles(other.x, other.y, '#00ff99', 1.1, 4);
                                spawnFloatingText(other.x, other.y, "+5 HEAL", "#00ff99");
                            }
                        }
                        e.healCooldown = 2.8;
                    }
                }

                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.hypot(dx, dy) || 0.001;

                e.knockX *= Math.pow(0.12, dt);
                e.knockY *= Math.pow(0.12, dt);
                let finalVx = e.knockX;
                let finalVy = e.knockY;

                // 敵人之間軟碰撞分離力 (Separation Steering via Spatial Hash Grid)
                const neighbors = enemyGrid.query(e.x, e.y, e.width + 16);
                for (let n = 0; n < neighbors.length; n++) {
                    const other = neighbors[n];
                    if (other === e || other.isSpawning) continue;
                    const sdx = e.x - other.x;
                    const sdy = e.y - other.y;
                    const sdist = Math.hypot(sdx, sdy) || 0.001;
                    const minSep = (e.width + other.width) * 0.48;
                    if (sdist < minSep) {
                        const push = ((minSep - sdist) / minSep) * 190;
                        finalVx += (sdx / sdist) * push;
                        finalVy += (sdy / sdist) * push;
                    }
                }

                const targetAngle = Math.atan2(dy, dx);
                let diffAngle = targetAngle - e.facingAngle;
                while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
                while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
                e.facingAngle += diffAngle * (e.type === 'juggernaut' ? 2.5 : 7.5) * dt;

                if (currentSpeed > 0) {
                    if (e.type === 'melee' || e.type === 'juggernaut' || e.type === 'swarm' || e.type === 'infiltrator') {
                        if (dist < 680) {
                            finalVx += (dx / dist) * currentSpeed;
                            finalVy += (dy / dist) * currentSpeed;
                        }
                    } else if (e.type === 'shooter' || e.type === 'healer') {
                        if (dist < 260) {
                            finalVx -= (dx / dist) * currentSpeed;
                            finalVy -= (dy / dist) * currentSpeed;
                        } else if (dist > 360 && dist < 680) {
                            finalVx += (dx / dist) * currentSpeed;
                            finalVy += (dy / dist) * currentSpeed;
                        }
                        e.fireCooldown -= dt;
                        if (e.type === 'shooter' && dist < 540 && e.fireCooldown <= 0) {
                            const spread = inSteam ? (Math.random() - 0.5) * 0.65 : 0;
                            const ang = Math.atan2(dy, dx) + spread;
                            bulletPool.spawn({
                                x: e.x, y: e.y,
                                vx: Math.cos(ang) * 470, vy: Math.sin(ang) * 470,
                                radius: 8, color: '#ff3344', bounces: 0, isEnemy: true
                            });
                            e.fireCooldown = 1.85;
                            playSound('shoot', { x: e.x, pitch: 440 });
                        }
                    } else if (e.type === 'mortar') {
                        if (dist < 320) {
                            finalVx -= (dx / dist) * currentSpeed;
                            finalVy -= (dy / dist) * currentSpeed;
                        }
                        e.fireCooldown -= dt;
                        if (e.fireCooldown <= 0 && dist < 640) {
                            const leadX = player.x + (player.isDashing ? player.dashDirX * 110 : 0);
                            const leadY = player.y + (player.isDashing ? player.dashDirY * 110 : 0);
                            const spread = inSteam ? (Math.random() - 0.5) * 0.65 : 0;
                            const angle = Math.atan2(leadY - e.y, leadX - e.x) + spread;
                            bulletPool.spawn({
                                x: e.x, y: e.y,
                                vx: Math.cos(angle) * 365, vy: Math.sin(angle) * 365,
                                radius: 13, color: '#ffaa00', bounces: 0, isEnemy: true, isMortar: true
                            });
                            e.fireCooldown = 2.55;
                            playSound('shoot', { x: e.x, pitch: 320 });
                        }
                    } else if (e.type === 'boss') {
                        // 三大 Boss 專屬行為機
                        if (e.bossArchetype === 'omega') {
                            if (e.hp < e.maxHp * 0.3) {
                                e.phase = 3;
                                e.color = '#18002e';
                                // 奇異點黑洞牽引：強制通過 moveEntity 滑動碰撞，絕不推玩家穿牆！
                                moveEntity(player, ((e.x - player.x) / dist) * 190, ((e.y - player.y) / dist) * 190, dt);
                                if (Math.random() > 0.45) spawnParticles(e.x, e.y, '#9900ff', 3.6, 2);
                            } else if (e.hp < e.maxHp * 0.62) {
                                e.phase = 2;
                                e.color = '#ff00aa';
                            }

                            const speedMod = e.phase >= 2 ? 1.4 : 1.0;
                            if (e.laserFireTimer > 0) {
                                e.laserFireTimer -= dt;
                                finalVx = 0; finalVy = 0;
                                const laserDist = Math.abs(Math.cos(e.laserAngle) * (player.y - e.y) - Math.sin(e.laserAngle) * (player.x - e.x));
                                const dotProd = Math.cos(e.laserAngle) * (player.x - e.x) + Math.sin(e.laserAngle) * (player.y - e.y);
                                if (dotProd > 0 && laserDist < 48 && player.invulnTimer <= 0 && !player.isDashing) {
                                    if (player.isGuarding) {
                                        playSound('parry', { x: player.x });
                                        triggerHitStop(0.1, 10);
                                        player.knockX += Math.cos(e.laserAngle) * 280;
                                        player.knockY += Math.sin(e.laserAngle) * 280;
                                    } else {
                                        playerTakeDamage(2);
                                    }
                                }
                            } else if (e.laserWarnTimer > 0) {
                                e.laserWarnTimer -= dt;
                                finalVx = 0; finalVy = 0;
                                e.laserAngle = Math.atan2(player.y - e.y, player.x - e.x);
                                if (e.laserWarnTimer <= 0) {
                                    e.laserFireTimer = 0.65;
                                    playSound('laser', { x: e.x });
                                    triggerScreenShake(18);
                                }
                            } else {
                                finalVx += (dx / dist) * currentSpeed * speedMod;
                                finalVy += (dy / dist) * currentSpeed * speedMod;
                                e.fireCooldown -= dt;
                                if (e.fireCooldown <= 0) {
                                    if (Math.random() > 0.56 && e.phase < 3) {
                                        e.laserWarnTimer = 1.05;
                                    } else {
                                        const count = e.phase >= 2 ? 20 : 12;
                                        for (let k = 0; k < count; k++) {
                                            const angle = (k / count) * Math.PI * 2 + (e.phase >= 2 ? timestamp / 750 : 0);
                                            bulletPool.spawn({
                                                x: e.x, y: e.y,
                                                vx: Math.cos(angle) * 340, vy: Math.sin(angle) * 340,
                                                radius: 9.5, color: e.phase >= 2 ? '#ff00aa' : '#ff0044',
                                                bounces: 1, isEnemy: true
                                            });
                                        }
                                        e.fireCooldown = e.phase >= 2 ? 1.15 : 2.2;
                                        playSound('shoot', { x: e.x, pitch: 280 });
                                    }
                                }
                            }
                        } else if (e.bossArchetype === 'hydra') {
                            e.phase = e.hp < e.maxHp * 0.5 ? 2 : 1;
                            const orbitDir = e.hydraRole === 'ALPHA' ? 1 : -1;
                            const perpX = -dy / dist * orbitDir;
                            const perpY = dx / dist * orbitDir;
                            finalVx += ((dx / dist) * 0.55 + perpX * 0.85) * currentSpeed;
                            finalVy += ((dy / dist) * 0.55 + perpY * 0.85) * currentSpeed;

                            // 時間減速力場釋放
                            e.chronoFieldTimer -= dt;
                            if (e.chronoFieldTimer <= 0) {
                                e.chronoFieldTimer = 5.5;
                                cryoZones.push({ x: player.x, y: player.y, radius: 135, life: 4.5 });
                                addShockwave(player.x, player.y, 160, 'rgba(0, 255, 204, 0.8)', 1.1);
                                spawnFloatingText(e.x, e.y - 30, "CHRONO DILATION FIELD!", "#00ffcc");
                            }

                            e.fireCooldown -= dt;
                            if (e.fireCooldown <= 0) {
                                const baseAng = Math.atan2(dy, dx);
                                for (let s = -2; s <= 2; s++) {
                                    const ang = baseAng + s * 0.16;
                                    bulletPool.spawn({
                                        x: e.x, y: e.y,
                                        vx: Math.cos(ang) * 430, vy: Math.sin(ang) * 430,
                                        radius: 8.5, color: e.color, bounces: 1, isEnemy: true
                                    });
                                }
                                e.fireCooldown = e.phase === 2 ? 1.15 : 1.75;
                                playSound('shoot', { x: e.x, pitch: 520 });
                            }
                        } else if (e.bossArchetype === 'seraph') {
                            e.phase = e.hp < e.maxHp * 0.35 ? 3 : (e.hp < e.maxHp * 0.7 ? 2 : 1);
                            e.meteorAngle += dt * 2.2;
                            // 懸浮漂移
                            finalVx += Math.cos(timestamp / 600) * currentSpeed * 0.8 + (dx / dist) * 40;
                            finalVy += Math.sin(timestamp / 500) * currentSpeed * 0.8 + (dy / dist) * 40;

                            // 全屏空間切割次元斬 (Dimensional Cleave)
                            e.riftSlashTimer -= dt;
                            if (e.riftSlashTimer <= 0 && e.riftLines.length === 0) {
                                const slashCount = e.phase >= 2 ? 4 : 3;
                                for (let sl = 0; sl < slashCount; sl++) {
                                    const ang = (sl / slashCount) * Math.PI + (Math.random() - 0.5) * 0.4;
                                    e.riftLines.push({
                                        x: player.x + (Math.random() - 0.5) * 140,
                                        y: player.y + (Math.random() - 0.5) * 140,
                                        angle: ang,
                                        timer: 1.15
                                    });
                                }
                                spawnFloatingText(e.x, e.y - 45, "DIMENSIONAL RIFT CLEAVE!", "#ffcc00", true);
                            }

                            for (let rIdx = e.riftLines.length - 1; rIdx >= 0; rIdx--) {
                                const rl = e.riftLines[rIdx];
                                rl.timer -= dt;
                                if (rl.timer <= 0) {
                                    // 次元斬引爆
                                    playSound('laser', { x: rl.x });
                                    triggerScreenShake(15);
                                    const lineDist = Math.abs(Math.cos(rl.angle) * (player.y - rl.y) - Math.sin(rl.angle) * (player.x - rl.x));
                                    if (lineDist < 34 && player.invulnTimer <= 0 && !player.isDashing) {
                                        if (player.isGuarding) {
                                            playSound('parry', { x: player.x });
                                            player.addSp(25);
                                        } else {
                                            playerTakeDamage(2);
                                        }
                                    }
                                    e.riftLines.splice(rIdx, 1);
                                    if (e.riftLines.length === 0) e.riftSlashTimer = e.phase >= 2 ? 3.8 : 5.2;
                                }
                            }

                            // 幾何萬花筒黃金螺旋彈幕 + 隕石投擲
                            e.fireCooldown -= dt;
                            if (e.fireCooldown <= 0) {
                                const petals = e.phase >= 2 ? 8 : 6;
                                for (let p = 0; p < petals; p++) {
                                    const a1 = (p / petals) * Math.PI * 2 + timestamp / 450;
                                    const a2 = -(p / petals) * Math.PI * 2 - timestamp / 450;
                                    bulletPool.spawn({
                                        x: e.x, y: e.y,
                                        vx: Math.cos(a1) * 320, vy: Math.sin(a1) * 320,
                                        radius: 8, color: '#ffcc00', bounces: 0, isEnemy: true
                                    });
                                    if (e.phase >= 2) {
                                        bulletPool.spawn({
                                            x: e.x, y: e.y,
                                            vx: Math.cos(a2) * 290, vy: Math.sin(a2) * 290,
                                            radius: 8, color: '#ff00aa', bounces: 0, isEnemy: true
                                        });
                                    }
                                }
                                // 投擲高爆引力隕石
                                const mAng = Math.atan2(dy, dx);
                                bulletPool.spawn({
                                    x: e.x + Math.cos(e.meteorAngle) * 70,
                                    y: e.y + Math.sin(e.meteorAngle) * 70,
                                    vx: Math.cos(mAng) * 460, vy: Math.sin(mAng) * 460,
                                    radius: 15, color: '#ff5500', bounces: 0, isEnemy: true, isMortar: true
                                });
                                e.fireCooldown = e.phase === 3 ? 0.95 : 1.35;
                                playSound('shoot', { x: e.x, pitch: 620 });
                            }
                        }
                    }
                }

                moveEntity(e, finalVx, finalVy, dt);

                // 敵我接觸碰撞與完美彈反
                if (dist < (player.width * 0.5 + e.width * 0.5) && player.invulnTimer <= 0 && !player.isDashing) {
                    let blocked = false;
                    if (player.isGuarding) {
                        const angleToEnemy = Math.atan2(e.y - player.y, e.x - player.x);
                        let angleDiff = Math.abs(angleToEnemy - player.guardAngle);
                        while (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                        if (angleDiff < Math.PI / 2.3) {
                            blocked = true;
                            const parryWindow = player.hasPerk('parry_master') ? 0.42 : 0.28;
                            const isPerfect = player.guardTimer < parryWindow;
                            if (isPerfect) {
                                playSound('parry', { x: player.x });
                                triggerHitStop(0.16, 22);
                                triggerBulletTime(0.55);
                                player.addSp(35);
                                spawnFloatingText(player.x, player.y - 35, "PERFECT DEFLECT!", "#ffffff", true);
                                addShockwave(player.x, player.y, 190, 'rgba(255, 255, 255, 0.95)', 1.35);

                                if (player.hasSynergy('aegis_vampire_matrix')) {
                                    if (player.hp < player.maxHp) player.hp++;
                                    else player.shield = Math.min(player.maxShield, player.shield + 1);
                                    createExplosion(player.x, player.y, 140, 20 * player.getEffectiveAtkMult(), 1);
                                }

                                e.knockX = Math.cos(angleToEnemy) * 1650;
                                e.knockY = Math.sin(angleToEnemy) * 1650;
                                e.flashTimer = 0.45;
                                if (e.stagger !== undefined) e.stagger += 35;
                                const pDmg = player.level * 4.5 * player.getEffectiveAtkMult();
                                e.hp -= pDmg;
                                totalDamageDealt += pDmg;
                                e.stunTimer = 2.4;
                                spawnParticles(player.x, player.y, '#ffffff', 2.8, 16);

                                if (player.hasPerk('parry_master')) {
                                    for (let b = 0; b < 4; b++) {
                                        const pAngle = angleToEnemy + (b - 1.5) * 0.26;
                                        bulletPool.spawn({
                                            x: player.x, y: player.y,
                                            vx: Math.cos(pAngle) * 980, vy: Math.sin(pAngle) * 980,
                                            radius: 8, color: '#00ffcc', bounces: 2,
                                            isEnemy: false, element: player.element, isPiercing: true
                                        });
                                    }
                                }
                            } else {
                                playSound('hit', { x: player.x });
                                player.knockX += (player.x - e.x) * 4;
                                player.knockY += (player.y - e.y) * 4;
                                e.knockX += (e.x - player.x) * 4;
                                e.knockY += (e.y - player.y) * 4;
                                spawnFloatingText(player.x, player.y - 30, "BLOCK", "#aaaaaa");
                            }
                        }
                    }

                    if (!blocked && e.type !== 'boss') {
                        playerTakeDamage(1);
                    }
                }

                // 敵人死亡 / Hydra 雙核心假死處理
                if (e.hp <= 0) {
                    if (e.bossArchetype === 'hydra' && e.hydraDownTimer <= 0) {
                        // 檢查另一條 Hydra 核心是否尚存
                        let partnerAlive = false;
                        for (let j = 0; j < enemies.length; j++) {
                            if (j !== i && enemies[j].hydraGroupId === e.hydraGroupId && enemies[j].hydraDownTimer <= 0 && enemies[j].hp > 0) {
                                partnerAlive = true;
                                break;
                            }
                        }
                        if (partnerAlive) {
                            e.hp = 1;
                            e.hydraDownTimer = 5.0;
                            playSound('emp', { x: e.x });
                            spawnFloatingText(e.x, e.y - 35, "CORE STASIS — 5.0S TO KILL TWIN!", "#ff00aa", true);
                            continue;
                        }
                    }

                    spawnParticles(e.x, e.y, e.color, 2.5, 18);
                    stampDecal('oil', e.x, e.y, e.width * 0.75, Math.random() * Math.PI * 2);
                    playSound('hit', { x: e.x });
                    totalKills++;

                    if (e.type === 'swarm' && e.width > 20) {
                        for (let s = 0; s < 2; s++) {
                            enemies.push({
                                x: e.x + (s === 0 ? -12 : 12), y: e.y,
                                width: 18, height: 18, type: 'swarm',
                                speed: 225, hp: 1.5, maxHp: 1.5, color: '#00ff88',
                                flashTimer: 0, knockX: (s === 0 ? -220 : 220), knockY: 0,
                                fireCooldown: 0, isSpawning: false, spawnTimer: 0,
                                burnTimer: 0, chillTimer: 0, stunTimer: 0, shattered: false, facingAngle: 0
                            });
                        }
                    }

                    if (player.hasPerk('vampiric') && Math.random() < 0.12) {
                        player.hp = Math.min(player.maxHp, player.hp + 1);
                        spawnFloatingText(player.x, player.y - 25, "+1 HP DRAIN", "#00ff88");
                    }

                    const dropsCount = e.type === 'boss' ? 40 : (e.type === 'juggernaut' || e.type === 'mortar' ? 4 : 1);
                    for (let k = 0; k < dropsCount; k++) {
                        const roll = Math.random();
                        spawnDrop(e.x, e.y, roll > 0.90 ? 'hp' : (roll > 0.80 ? 'shield' : (roll > 0.72 ? 'shard' : 'exp')));
                    }

                    if (e.type === 'boss') {
                        triggerHitStop(0.55, 40);
                        bossFinisherTimer = 2.1;
                        addShockwave(e.x, e.y, 480, 'rgba(255, 0, 110, 1)', 1.6);
                        stampDecal('scorch', e.x, e.y, 120, 0);
                    }
                    enemies.splice(i, 1);
                }
            }

            // 衝擊波與爆炸更新
            for (let i = shockwaves.active.length - 1; i >= 0; i--) {
                const sw = shockwaves.active[i];
                sw.radius += (sw.maxRadius - sw.radius) * 12 * dt;
                sw.life -= dt;
                if (sw.life <= 0) shockwaves.releaseAt(i);
            }
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.radius += (exp.maxRadius - exp.radius) * 11 * dt;
                exp.life -= dt;
                if (exp.life <= 0) explosions.splice(i, 1);
            }
            for (let i = lightningBolts.length - 1; i >= 0; i--) {
                lightningBolts[i].life -= dt;
                if (lightningBolts[i].life <= 0) lightningBolts.splice(i, 1);
            }

            // 子彈更新：射線步進連續碰撞檢測 (Sub-Stepping CCD) + 磁軌彈射器 + 反彈
            const activeBullets = bulletPool.active;
            for (let i = activeBullets.length - 1; i >= 0; i--) {
                const b = activeBullets[i];
                let hitWall = false;
                let killBullet = false;

                if (b.isHoming && enemies.length > 0) {
                    let target = null;
                    let minD = 550;
                    const cands = enemyGrid.query(b.x, b.y, minD);
                    for (let c = 0; c < cands.length; c++) {
                        const e = cands[c];
                        if (e.isSpawning) continue;
                        const d = Math.hypot(e.x - b.x, e.y - b.y);
                        if (d < minD) { minD = d; target = e; }
                    }

                    if (target) {
                        const angleToTarget = Math.atan2(target.y - b.y, target.x - b.x);
                        let currentAngle = Math.atan2(b.vy, b.vx);
                        let angleDiff = angleToTarget - currentAngle;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        currentAngle += angleDiff * (dt * 7.5);
                        const speed = Math.hypot(b.vx, b.vy);
                        b.vx = Math.cos(currentAngle) * speed;
                        b.vy = Math.sin(currentAngle) * speed;
                    }
                }

                // 檢查是否穿過磁軌彈射器 (Tile 12: Rail Booster)
                if (!b.railBoosted) {
                    const curT = getTile(b.x, b.y);
                    if (curT.type === 12) {
                        b.railBoosted = true;
                        b.vx *= 1.85;
                        b.vy *= 1.85;
                        b.radius *= 1.55;
                        b.damageMult *= 1.65;
                        b.isPiercing = true;
                        playSound('dash', { x: b.x });
                        addShockwave(b.x, b.y, 95, 'rgba(0, 255, 204, 0.9)', 0.9);
                        spawnParticles(b.x, b.y, '#00ffcc', 2.0, 10);
                    }
                }

                // Sub-Stepping CCD (每步最大位移 <= 10px，徹底杜絕高速子彈穿牆或漏判)
                const stepDist = Math.hypot(b.vx * dt, b.vy * dt);
                const subSteps = Math.max(1, Math.ceil(stepDist / 10));
                const subDt = dt / subSteps;

                for (let step = 0; step < subSteps; step++) {
                    b.x += b.vx * subDt;
                    const tileX = getTile(b.x, b.y);
                    if (isSolidTile(tileX.type)) {
                        b.x -= b.vx * subDt;
                        b.vx *= -1;
                        b.bounces--;
                        hitWall = true;
                        if (!b.isEnemy) {
                            if (tileX.type === 2) breakCrate(tileX.col, tileX.row);
                            else if (tileX.type === 5) explodeBarrel(tileX.col, tileX.row);
                            else if (tileX.type === 6) destroyEMPPylon(tileX.col, tileX.row);
                            else if (tileX.type === 10) detonateCryoCanister(tileX.col, tileX.row);
                            else if (tileX.type === 11) triggerPlasmaConduitGrid(tileX.col, tileX.row);
                            else if (tileX.type === 3) triggerSwitch(tileX.col, tileX.row);
                        }
                    }

                    b.y += b.vy * subDt;
                    const tileY = getTile(b.x, b.y);
                    if (isSolidTile(tileY.type)) {
                        b.y -= b.vy * subDt;
                        b.vy *= -1;
                        b.bounces--;
                        hitWall = true;
                        if (!b.isEnemy) {
                            if (tileY.type === 2) breakCrate(tileY.col, tileY.row);
                            else if (tileY.type === 5) explodeBarrel(tileY.col, tileY.row);
                            else if (tileY.type === 6) destroyEMPPylon(tileY.col, tileY.row);
                            else if (tileY.type === 10) detonateCryoCanister(tileY.col, tileY.row);
                            else if (tileY.type === 11) triggerPlasmaConduitGrid(tileY.col, tileY.row);
                            else if (tileY.type === 3) triggerSwitch(tileY.col, tileY.row);
                        }
                    }

                    if (hitWall) {
                        if (player.hasPerk('bouncing_bullets') && !b.isEnemy) {
                            b.damageMult *= 1.45;
                        }
                        // 量子磁軌超頻羈絆：每次牆壁彈跳分裂出副射線彈
                        if (player.hasSynergy('quantum_railgun_overdrive') && !b.isEnemy && !b._splitChild && b.bounces >= 0) {
                            const baseAng = Math.atan2(b.vy, b.vx);
                            [-0.22, 0.22].forEach(offset => {
                                const child = bulletPool.spawn({
                                    x: b.x, y: b.y,
                                    vx: Math.cos(baseAng + offset) * 1150,
                                    vy: Math.sin(baseAng + offset) * 1150,
                                    radius: b.radius * 0.75,
                                    color: '#00ffcc',
                                    bounces: 1,
                                    isEnemy: false,
                                    element: b.element,
                                    isPiercing: true,
                                    damageMult: b.damageMult * 0.65
                                });
                                child._splitChild = true;
                            });
                        }
                        break;
                    }

                    // 敵我命中檢測
                    if (b.isEnemy) {
                        const distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);
                        const grazeRadius = player.width * 0.5 + b.radius + (player.hasPerk('grazing_reactor') ? 48 : 26);

                        if (player.isDashing && distToPlayer < grazeRadius && !b.grazed) {
                            b.grazed = true;
                            player.addSp(player.hasPerk('grazing_reactor') ? 22 : 14);
                            if (player.hasPerk('grazing_reactor')) {
                                player.dashCooldown = Math.max(0, player.dashCooldown - 0.25);
                            }
                            spawnFloatingText(player.x, player.y - 25, "GRAZE SURGE!", "#00ffcc");
                            triggerBulletTime(0.24);
                            playSound('parry', { x: player.x });
                        }

                        if (distToPlayer < (player.width * 0.5 + b.radius) && player.invulnTimer <= 0 && !player.isDashing && !player.isUltimate) {
                            let blocked = false;
                            if (player.isGuarding) {
                                const angleToBullet = Math.atan2(b.y - player.y, b.x - player.x);
                                let angleDiff = Math.abs(angleToBullet - player.guardAngle);
                                while (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                                if (angleDiff < Math.PI / 2.3) {
                                    blocked = true;
                                    const parryWindow = player.hasPerk('parry_master') ? 0.42 : 0.28;
                                    const isPerfect = player.guardTimer < parryWindow;
                                    if (isPerfect) {
                                        b.isEnemy = false;
                                        b.vx *= -2.4;
                                        b.vy *= -2.4;
                                        b.color = '#ffffff';
                                        b.bounces = 5;
                                        b.isPiercing = true;
                                        b.damageMult = 2.2;
                                        playSound('parry', { x: player.x });
                                        triggerHitStop(0.11, 15);
                                        triggerBulletTime(0.45);
                                        player.addSp(24);
                                        spawnFloatingText(player.x, player.y - 30, "DEFLECT COUNTER!", "#ffffff", true);
                                        spawnParticles(b.x, b.y, '#ffffff', 2.2, 10);

                                        if (player.hasSynergy('aegis_vampire_matrix')) {
                                            if (player.hp < player.maxHp) player.hp++;
                                            else player.shield = Math.min(player.maxShield, player.shield + 1);
                                        }
                                    } else {
                                        killBullet = true;
                                        playSound('hit', { x: player.x });
                                        player.knockX += b.vx * 0.2;
                                        player.knockY += b.vy * 0.2;
                                        spawnFloatingText(player.x, player.y - 30, "BLOCKED", "#aaaaaa");
                                    }
                                }
                            }

                            if (!blocked) {
                                playerTakeDamage(b.isMortar ? 2 : 1);
                                killBullet = true;
                            }
                            break;
                        }
                    } else {
                        // 使用空間雜湊網格查詢子彈附近的敵人
                        const nearbyEnemies = enemyGrid.query(b.x, b.y, b.radius + 55);
                        for (let j = 0; j < nearbyEnemies.length; j++) {
                            const e = nearbyEnemies[j];
                            if (e.isSpawning || b.hitSet.has(e)) continue;

                            if (Math.abs(b.x - e.x) < (e.width * 0.5 + b.radius) &&
                                Math.abs(b.y - e.y) < (e.height * 0.5 + b.radius)) {

                                b.hitSet.add(e);

                                if (e.type === 'juggernaut') {
                                    const angleToBullet = Math.atan2(b.y - e.y, b.x - e.x);
                                    let diff = Math.abs(angleToBullet - e.facingAngle);
                                    while (diff > Math.PI) diff = Math.PI * 2 - diff;
                                    if (diff < Math.PI / 2.4) {
                                        b.vx *= -1.2;
                                        b.vy *= -1.2;
                                        b.bounces--;
                                        b.isEnemy = true;
                                        b.color = '#ffffff';
                                        playSound('parry', { x: e.x });
                                        spawnParticles(b.x, b.y, '#00ffff', 2.0, 8);
                                        spawnFloatingText(e.x, e.y, "DEFLECTED", "#aaa");
                                        break;
                                    }
                                }

                                let dmg = ((b.isPiercing ? 3.8 : 1.9) + Math.floor(player.level * 0.65)) * player.getEffectiveAtkMult() * b.damageMult;
                                const angleToEnemy = Math.atan2(e.y - b.y, e.x - b.x);
                                let hitDiff = Math.abs(angleToEnemy - e.facingAngle);
                                while (hitDiff > Math.PI) hitDiff = Math.PI * 2 - hitDiff;
                                const isBackstab = hitDiff < Math.PI / 2.5;

                                const isChargedKinetic = (b.element === 0 && b.radius >= 13);
                                dmg = player.resolveElementalReaction(e, b.element, dmg, isChargedKinetic);

                                if (isBackstab) {
                                    dmg = Math.floor(dmg * 1.55);
                                    spawnFloatingText(e.x, e.y - 15, "CRIT!", "#ffff00");
                                }

                                e.hp -= dmg;
                                totalDamageDealt += dmg;
                                e.flashTimer = 0.1;
                                if (e.stagger !== undefined) e.stagger += (isChargedKinetic ? 18 : 5);
                                const knockMult = player.hasPerk('kinetic_mass') ? 1.6 : 1.0;
                                e.knockX = (b.vx / 950) * (e.type === 'boss' ? 28 : 235) * knockMult;
                                e.knockY = (b.vy / 950) * (e.type === 'boss' ? 28 : 235) * knockMult;

                                if (b.element === 1) {
                                    createExplosion(b.x, b.y, b.isPiercing ? 130 : 72, dmg * 0.85 + 3.5, 1);
                                } else if (b.element === 2) {
                                    e.chillTimer = 3.8;
                                } else if (b.element === 3) {
                                    if (e.stunTimer > 0) {
                                        triggerChainLightning(e.x, e.y, e, 2, 8 * player.getEffectiveAtkMult());
                                    }
                                    e.stunTimer = 1.8;
                                    spawnParticles(e.x, e.y, '#c300ff', 2.2, 6);
                                    if (player.hasPerk('chain_lightning')) {
                                        triggerChainLightning(e.x, e.y, e, 4, 11 * player.getEffectiveAtkMult());
                                    }
                                }

                                spawnParticles(b.x, b.y, b.color, 0.9, 7);
                                spawnFloatingText(e.x, e.y, Math.floor(dmg), b.isPiercing ? "#ffcc00" : "#ffffff", b.isPiercing || isBackstab);
                                player.addSp(7);
                                addCombo();
                                playSound('hit', { x: e.x });

                                if (!b.isPiercing || b.element === 1) {
                                    killBullet = true;
                                }
                                break;
                            }
                        }
                    }
                    if (killBullet) break;
                }

                if (hitWall) {
                    spawnParticles(b.x, b.y, b.color, 0.6, 5);
                    if (b.element === 1 && !b.isEnemy) {
                        createExplosion(b.x, b.y, b.isPiercing ? 125 : 68, (b.isPiercing ? 9 : 4.5) * player.getEffectiveAtkMult(), 1);
                    }
                }

                if (killBullet || b.bounces < 0 || b.x < 0 || b.x > MAP_WIDTH || b.y < 0 || b.y > MAP_HEIGHT) {
                    bulletPool.releaseAt(i);
                }
            }

            // 掉落物磁吸拾取
            const magnetMult = (player.hasPerk('magnet_pulse') ? 1.75 : 1.0) * (1 + metaSave.upgrades.shardLevel * 0.15);
            const magnetRadius = 215 * magnetMult;
            for (let i = drops.length - 1; i >= 0; i--) {
                const d = drops[i];
                d.vx *= Math.pow(0.06, dt);
                d.vy *= Math.pow(0.06, dt);
                d.x += d.vx * dt; d.y += d.vy * dt;
                d.life -= dt;

                const tileX = getTile(d.x, d.y);
                if (isSolidTile(tileX.type)) {
                    d.x -= d.vx * dt; d.y -= d.vy * dt;
                    d.vx *= -0.7; d.vy *= -0.7;
                }

                const dist = Math.hypot(player.x - d.x, player.y - d.y) || 0.001;
                if (dist < magnetRadius) {
                    const pullSpeed = 480 * magnetMult;
                    d.x += ((player.x - d.x) / dist) * pullSpeed * dt;
                    d.y += ((player.y - d.y) / dist) * pullSpeed * dt;
                }

                if (dist < 35) {
                    const resourceMult = (player.hasPerk('magnet_pulse') ? 1.35 : 1.0) * (1 + metaSave.upgrades.shardLevel * 0.2);
                    if (d.type === 'exp') {
                        player.exp += Math.ceil((1 + Math.floor(comboCount / 7)) * resourceMult);
                        playSound('exp', { x: d.x });
                        if (player.exp >= player.maxExp) player.levelUp();
                    } else if (d.type === 'hp') {
                        player.hp = Math.min(player.maxHp, player.hp + 2);
                        spawnFloatingText(d.x, d.y, "+2 HP", "#00ffcc");
                        playSound('exp', { x: d.x });
                    } else if (d.type === 'shield') {
                        player.shield = Math.min(player.maxShield, player.shield + 1);
                        spawnFloatingText(d.x, d.y, "+1 SHIELD", "#00d5ff");
                        playSound('exp', { x: d.x });
                    } else if (d.type === 'shard') {
                        const gain = Math.max(1, Math.round(2 * resourceMult));
                        metaSave.shards += gain;
                        runShardsEarned += gain;
                        spawnFloatingText(d.x, d.y, `+${gain} DATA SHARD`, "#ff00aa", true);
                        playSound('powerup');
                    }
                    drops.splice(i, 1);
                } else if (d.life <= 0) {
                    drops.splice(i, 1);
                }
            }
        }

        function gameLoop(timestamp) {
            const timeSec = timestamp * 0.001;
            let realDt = (timestamp - lastTime) * 0.001;
            if (!Number.isFinite(realDt) || realDt > 0.1 || realDt < 0) realDt = 0.016;
            lastTime = timestamp;

            fpsFrames++;
            fpsTimer += realDt;
            if (fpsTimer >= 0.5) {
                fpsCounter = Math.round(fpsFrames / fpsTimer);
                fpsFrames = 0;
                fpsTimer = 0;
            }

            if (activeModal) {
                renderModalOverlay(timestamp);
                presentFrame(timeSec);
                clearInputEdges();
                requestAnimationFrame(gameLoop);
                return;
            }

            if (gameState === 'start') {
                renderStartScreen(timestamp);
                presentFrame(timeSec);
                clearInputEdges();
                requestAnimationFrame(gameLoop);
                return;
            }

            if (gameState === 'levelup') {
                renderLevelUpScreen(timestamp);
                if (keyJustPressed['Digit1'] && offeredPerks[0]) applyPerk(offeredPerks[0]);
                else if (keyJustPressed['Digit2'] && offeredPerks[1]) applyPerk(offeredPerks[1]);
                else if (keyJustPressed['Digit3'] && offeredPerks[2]) applyPerk(offeredPerks[2]);
                else if (keyJustPressed['KeyR'] && perkRerolls > 0) {
                    perkRerolls--;
                    rollPerks();
                    playSound('switch');
                }
                presentFrame(timeSec);
                clearInputEdges();
                requestAnimationFrame(gameLoop);
                return;
            }

            if (gameState === 'gameover') {
                renderGameOverScreen(timestamp);
                if (keyJustPressed['KeyR']) resetGame();
                presentFrame(timeSec);
                clearInputEdges();
                requestAnimationFrame(gameLoop);
                return;
            }

            if (gameState === 'paused') {
                renderPauseScreen();
                presentFrame(timeSec);
                clearInputEdges();
                requestAnimationFrame(gameLoop);
                return;
            }

            // 動態視覺計時器衰減
            if (screenShake > 0) { screenShake *= Math.pow(0.015, realDt); if (screenShake < 0.3) screenShake = 0; }
            if (chromaticAberration > 0) { chromaticAberration = Math.max(0, chromaticAberration - realDt * 2.4); }
            if (comboTimer > 0) { comboTimer -= realDt; if (comboTimer <= 0) comboCount = 0; }
            if (waveAnnounceTimer > 0) waveAnnounceTimer -= realDt;
            if (arenaTransitionTimer > 0) arenaTransitionTimer -= realDt;
            if (synergyBannerTimer > 0) synergyBannerTimer -= realDt;

            if (bossFinisherTimer > 0) { bossFinisherTimer -= realDt; globalTimeScale = 0.06; }
            else if (slowMoTimer > 0) { slowMoTimer -= realDt; globalTimeScale = 0.25; }
            else { globalTimeScale = 1.0; }

            if (hitStop > 0) {
                hitStop -= realDt;
            } else {
                physicsAccumulator += realDt * globalTimeScale;
                if (physicsAccumulator > 0.1) physicsAccumulator = 0.1;
                while (physicsAccumulator >= FIXED_DT) {
                    stepFixedPhysics(FIXED_DT, timestamp);
                    physicsAccumulator -= FIXED_DT;
                }
            }

            // 粒子與殘影消散 (使用實時步長保持流暢)
            for (let i = ghostPool.active.length - 1; i >= 0; i--) {
                const g = ghostPool.active[i];
                g.life -= realDt;
                if (g.life <= 0) ghostPool.releaseAt(i);
            }
            for (let i = particlePool.active.length - 1; i >= 0; i--) {
                const p = particlePool.active[i];
                p.x += p.vx * realDt;
                p.y += p.vy * realDt;
                p.life -= realDt;
                if (p.life <= 0) particlePool.releaseAt(i);
            }
            for (let i = floatingTextPool.active.length - 1; i >= 0; i--) {
                const ft = floatingTextPool.active[i];
                ft.vy += 520 * realDt;
                ft.x += ft.vx * realDt;
                ft.y += ft.vy * realDt;
                ft.life -= realDt;
                if (ft.life <= 0) floatingTextPool.releaseAt(i);
            }

            renderGameplay(timestamp, realDt);
            presentFrame(timeSec);
            clearInputEdges();
            requestAnimationFrame(gameLoop);
        }

        function clearInputEdges() {
            for (let k in keyJustPressed) keyJustPressed[k] = false;
            mouse.justClicked = false;
        }

        // =====================================================================
        //  十三、2D 遊戲世界與所有 3A UI/圖鑑/實驗室渲染管線
        // =====================================================================
        function renderGameplay(timestamp, realDt) {
            ctx.fillStyle = '#060b14';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.save();

            if (bossFinisherTimer > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${(bossFinisherTimer / 2.1) * 0.45})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }

            ctx.translate(WIDTH / 2, HEIGHT / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-WIDTH / 2, -HEIGHT / 2);

            const shakeOffsetX = (Math.random() - 0.5) * screenShake;
            const shakeOffsetY = (Math.random() - 0.5) * screenShake;
            ctx.translate(-camera.x + shakeOffsetX, -camera.y + shakeOffsetY);

            // 1. 地板賽博網格與環境微粒
            const gridColors = ['rgba(0, 255, 204, 0.055)', 'rgba(255, 0, 170, 0.055)', 'rgba(0, 170, 255, 0.055)', 'rgba(255, 204, 0, 0.055)'];
            ctx.strokeStyle = gridColors[arenaThemeIndex % 4];
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= MAP_WIDTH; x += 32) { ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); }
            for (let y = 0; y <= MAP_HEIGHT; y += 32) { ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); }
            ctx.stroke();

            // 2. 持久戰場貼花層 (焦黑彈坑、冷卻液霜痕、機油、彈殼)
            ctx.drawImage(decalCanvas, 0, 0);

            // 3. 低溫液氮滑行冰面區
            for (let i = 0; i < cryoZones.length; i++) {
                const cz = cryoZones[i];
                const alpha = Math.min(0.42, cz.life * 0.08);
                const g = ctx.createRadialGradient(cz.x, cz.y, 10, cz.x, cz.y, cz.radius);
                g.addColorStop(0, `rgba(170, 240, 255, ${alpha})`);
                g.addColorStop(1, 'rgba(0, 195, 255, 0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(cz.x, cz.y, cz.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            ambientParticles.forEach(p => {
                p.y += p.vy * realDt;
                p.x += p.vx * realDt;
                if (p.y < 0) p.y = MAP_HEIGHT;
                if (p.x < 0) p.x = MAP_WIDTH;
                if (p.x > MAP_WIDTH) p.x = 0;
                ctx.fillStyle = `rgba(0, 255, 204, ${0.08 + Math.abs(Math.sin(timestamp / 500 + p.x)) * 0.12})`;
                ctx.fillRect(p.x, p.y, p.s, p.s);
            });

            // 視錐剔除範圍
            const startCol = Math.max(0, Math.floor((camera.x - 120) / TILE_SIZE));
            const endCol = Math.min(MAP_COLS - 1, startCol + Math.ceil(WIDTH / camera.zoom / TILE_SIZE) + 3);
            const startRow = Math.max(0, Math.floor((camera.y - 120) / TILE_SIZE));
            const endRow = Math.min(MAP_ROWS - 1, startRow + Math.ceil(HEIGHT / camera.zoom / TILE_SIZE) + 3);

            // 地圖投影層
            ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    if (isSolidTile(mapData[r][c])) {
                        ctx.fillRect(c * TILE_SIZE + 6, r * TILE_SIZE + 12, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // 地圖磚塊與互動機關渲染
            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    const tile = mapData[r][c];
                    const tx = c * TILE_SIZE;
                    const ty = r * TILE_SIZE;
                    if (tile === 1) {
                        ctx.drawImage(prebakedTiles[1], tx, ty);
                    } else if (tile === 2) {
                        ctx.drawImage(prebakedTiles[2], tx, ty);
                    } else if (tile === 3) {
                        ctx.fillStyle = '#00ffcc';
                        ctx.beginPath();
                        ctx.moveTo(tx + 32, ty + 10); ctx.lineTo(tx + 54, ty + 32);
                        ctx.lineTo(tx + 32, ty + 54); ctx.lineTo(tx + 10, ty + 32);
                        ctx.closePath(); ctx.fill();
                    } else if (tile === 4) {
                        ctx.fillStyle = `rgba(255, 0, 68, ${0.7 + Math.abs(Math.sin(timestamp / 80)) * 0.3})`;
                        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                    } else if (tile === 5) {
                        // 高爆油桶
                        ctx.fillStyle = '#cc2222';
                        ctx.beginPath(); ctx.roundRect(tx + 10, ty + 8, TILE_SIZE - 20, TILE_SIZE - 16, 8); ctx.fill();
                        ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2; ctx.stroke();
                        ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                        ctx.fillText('TNT', tx + 32, ty + 37);
                    } else if (tile === 6) {
                        // EMP 水晶塔
                        ctx.fillStyle = '#00d5ff';
                        ctx.beginPath();
                        ctx.arc(tx + 32, ty + 32, 19 + Math.sin(timestamp / 120) * 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
                    } else if (tile === 7) {
                        // 量子加速墊
                        ctx.fillStyle = 'rgba(0, 255, 204, 0.18)';
                        ctx.fillRect(tx + 4, ty + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
                        ctx.fillText('>>', tx + 32, ty + 39);
                    } else if (tile === 8 || tile === 9) {
                        // 雙向蟲洞傳送門
                        ctx.fillStyle = `rgba(195, 0, 255, ${0.42 + Math.sin(timestamp / 150) * 0.25})`;
                        ctx.beginPath();
                        ctx.arc(tx + 32, ty + 32, 24, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 3; ctx.stroke();
                    } else if (tile === 10) {
                        // 低溫液氮罐 (Cryo-Canister)
                        ctx.fillStyle = '#0088cc';
                        ctx.beginPath(); ctx.roundRect(tx + 12, ty + 8, TILE_SIZE - 24, TILE_SIZE - 16, 8); ctx.fill();
                        ctx.strokeStyle = '#aaddff'; ctx.lineWidth = 2.5; ctx.stroke();
                        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
                        ctx.fillText('CRYO', tx + 32, ty + 36);
                    } else if (tile === 11) {
                        // 等離子導管 (Plasma Conduit)
                        ctx.fillStyle = '#240838';
                        ctx.beginPath(); ctx.arc(tx + 32, ty + 32, 22, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = '#c300ff'; ctx.lineWidth = 3; ctx.stroke();
                        ctx.fillStyle = '#ff66ff';
                        ctx.beginPath(); ctx.arc(tx + 32, ty + 32, 8 + Math.sin(timestamp / 80) * 3, 0, Math.PI * 2); ctx.fill();
                    } else if (tile === 12) {
                        // 磁軌彈射器 (Rail Booster)
                        ctx.strokeStyle = '#00ffcc';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(tx + 32, ty + 32, 22, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.strokeStyle = 'rgba(0, 255, 204, 0.35)';
                        ctx.beginPath();
                        ctx.arc(tx + 32, ty + 32, 12 + (timestamp / 20) % 10, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            }

            // 史萊姆焦土烈焰
            for (let i = 0; i < slimeTrails.length; i++) {
                const tr = slimeTrails[i];
                ctx.fillStyle = `rgba(255, 68, 0, ${(tr.life / tr.maxLife) * 0.55})`;
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, tr.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 衝擊波、電弧與爆炸
            for (let i = 0; i < shockwaves.active.length; i++) {
                const sw = shockwaves.active[i];
                ctx.strokeStyle = sw.color;
                ctx.lineWidth = (sw.life / sw.maxLife) * 7;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
            for (let i = 0; i < lightningBolts.length; i++) {
                const lb = lightningBolts[i];
                ctx.strokeStyle = '#c300ff';
                ctx.lineWidth = lb.thick || 3.5;
                ctx.beginPath();
                ctx.moveTo(lb.x1, lb.y1);
                const midX = (lb.x1 + lb.x2) * 0.5 + (Math.random() - 0.5) * 32;
                const midY = (lb.y1 + lb.y2) * 0.5 + (Math.random() - 0.5) * 32;
                ctx.lineTo(midX, midY);
                ctx.lineTo(lb.x2, lb.y2);
                ctx.stroke();
            }
            for (let i = 0; i < explosions.length; i++) {
                const exp = explosions[i];
                const grad = ctx.createRadialGradient(exp.x, exp.y, 0, exp.x, exp.y, exp.radius);
                if (exp.element === 3) {
                    grad.addColorStop(0, `rgba(255, 220, 255, ${exp.life * 2.8})`);
                    grad.addColorStop(0.45, `rgba(195, 0, 255, ${exp.life * 2.2})`);
                } else {
                    grad.addColorStop(0, `rgba(255, 235, 110, ${exp.life * 2.8})`);
                    grad.addColorStop(0.45, `rgba(255, 70, 0, ${exp.life * 2.2})`);
                }
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 掉落物
            for (let i = 0; i < drops.length; i++) {
                const d = drops[i];
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(timestamp / 170);
                if (d.type === 'exp') {
                    ctx.fillStyle = '#00aaff';
                    ctx.fillRect(-6, -6, 12, 12);
                } else if (d.type === 'hp') {
                    ctx.fillStyle = '#00ff44';
                    ctx.fillRect(-8, -8, 16, 16);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-2, -6, 4, 12);
                    ctx.fillRect(-6, -2, 12, 4);
                } else if (d.type === 'shield') {
                    ctx.fillStyle = '#00d5ff';
                    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
                } else if (d.type === 'shard') {
                    ctx.fillStyle = '#ff00aa';
                    ctx.beginPath();
                    ctx.moveTo(0, -9); ctx.lineTo(7, 0); ctx.lineTo(0, 9); ctx.lineTo(-7, 0);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }

            // 柔體殘影
            for (let i = 0; i < ghostPool.active.length; i++) {
                const g = ghostPool.active[i];
                ctx.fillStyle = g.color;
                ctx.globalAlpha = (g.life / g.maxLife) * 0.42;
                player.drawSoftContour(ctx, g.nodes);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // 敵群渲染
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (e.isSpawning) {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.width, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 0, 68, ${Math.abs(Math.sin(e.spawnTimer * 10))})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = `rgba(255, 0, 68, 0.2)`;
                    ctx.fill();
                    continue;
                }

                drawShadow(ctx, e.x, e.y, e.width);
                let renderColor = e.color;
                if (e.flashTimer > 0) renderColor = '#ffffff';
                else if (e.staggerBrokenTimer > 0) renderColor = '#ffcc00';
                else if (e.stunTimer > 0) renderColor = '#c300ff';
                else if (e.chillTimer > 0) renderColor = '#aaddff';
                else if (e.burnTimer > 0 && Math.floor(timestamp / 90) % 2 === 0) renderColor = '#ff4400';

                if (e.type === 'infiltrator' && e.invisTimer < 0) ctx.globalAlpha = 0.24;
                if (e.hydraDownTimer > 0) ctx.globalAlpha = 0.45;

                // 破甲光環標記
                if (e.shattered) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.width * 0.65, 0, Math.PI * 2);
                    ctx.stroke();
                }

                if (e.type === 'juggernaut') {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.rotate(e.facingAngle);
                    ctx.beginPath();
                    ctx.arc(0, 0, e.width / 2 + 7, -Math.PI / 2.3, Math.PI / 2.3);
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 8;
                    ctx.stroke();
                    ctx.restore();
                }

                // Boss 特效 (雷射、熾天使次元斬線、軌道隕石)
                if (e.type === 'boss') {
                    if (e.bossArchetype === 'omega') {
                        if (e.laserWarnTimer > 0) {
                            ctx.beginPath();
                            ctx.moveTo(e.x, e.y);
                            ctx.lineTo(e.x + Math.cos(e.laserAngle) * 1600, e.y + Math.sin(e.laserAngle) * 1600);
                            ctx.strokeStyle = `rgba(255, 0, 0, ${Math.abs(Math.sin(timestamp / 45))})`;
                            ctx.lineWidth = 4;
                            ctx.stroke();
                        } else if (e.laserFireTimer > 0) {
                            ctx.beginPath();
                            ctx.moveTo(e.x, e.y);
                            ctx.lineTo(e.x + Math.cos(e.laserAngle) * 1600, e.y + Math.sin(e.laserAngle) * 1600);
                            ctx.strokeStyle = '#ffffff';
                            ctx.lineWidth = 60 * (e.laserFireTimer / 0.65);
                            ctx.stroke();
                            ctx.strokeStyle = '#ff0044';
                            ctx.lineWidth = 30 * (e.laserFireTimer / 0.65);
                            ctx.stroke();
                        }
                    } else if (e.bossArchetype === 'seraph') {
                        // 軌道隕石視覺
                        const mx = e.x + Math.cos(e.meteorAngle) * 70;
                        const my = e.y + Math.sin(e.meteorAngle) * 70;
                        ctx.fillStyle = '#ff5500';
                        ctx.beginPath(); ctx.arc(mx, my, 14, 0, Math.PI * 2); ctx.fill();

                        // 次元斬預警線
                        for (let rIdx = 0; rIdx < e.riftLines.length; rIdx++) {
                            const rl = e.riftLines[rIdx];
                            ctx.strokeStyle = `rgba(255, 220, 40, ${Math.abs(Math.sin(timestamp / 35))})`;
                            ctx.lineWidth = 4;
                            ctx.beginPath();
                            ctx.moveTo(rl.x - Math.cos(rl.angle) * 1200, rl.y - Math.sin(rl.angle) * 1200);
                            ctx.lineTo(rl.x + Math.cos(rl.angle) * 1200, rl.y + Math.sin(rl.angle) * 1200);
                            ctx.stroke();
                        }
                    }
                }

                ctx.fillStyle = renderColor;
                ctx.beginPath();
                ctx.roundRect(e.x - e.width / 2, e.y - e.height / 2, e.width, e.height, e.type === 'boss' ? 16 : 8);
                ctx.fill();

                ctx.fillStyle = '#0b111a';
                if (e.type === 'boss') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(e.x - 16, e.y - 16, 11, 11);
                    ctx.fillRect(e.x + 5, e.y - 16, 11, 11);
                    ctx.fillStyle = '#ff0044';
                    ctx.fillRect(e.x - 13, e.y - 13, 5, 5);
                    ctx.fillRect(e.x + 8, e.y - 13, 5, 5);
                } else {
                    ctx.fillRect(e.x - 7, e.y - 7, 14, 4);
                }
                ctx.globalAlpha = 1.0;

                if (e.type !== 'boss') {
                    ctx.fillStyle = '#222';
                    ctx.fillRect(e.x - 22, e.y - e.height / 2 - 14, 44, 5);
                    ctx.fillStyle = e.shattered ? '#00ffff' : '#ff0044';
                    ctx.fillRect(e.x - 22, e.y - e.height / 2 - 14, 44 * Math.max(0, e.hp / e.maxHp), 5);
                }
            }

            // 玩家與僚機與軌道電漿網
            player.draw(ctx, timestamp);
            const activeDrones = player.hasPerk('drone_mk2') ? Math.max(2, player.droneCount) : player.droneCount;
            for (let d = 0; d < activeDrones; d++) drones[d].draw(ctx);
            updateAndDrawOrbitalTeslaWeb(ctx, realDt, timestamp);

            // 子彈渲染
            for (let i = 0; i < bulletPool.active.length; i++) {
                const b = bulletPool.active[i];
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.railBoosted ? '#ffffff' : b.color;
                ctx.fill();
                if (b.railBoosted || b.isPiercing) {
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }
            }

            // 致盲蒸氣雲
            for (let i = 0; i < steamClouds.length; i++) {
                const sc = steamClouds[i];
                const alpha = Math.min(0.45, sc.life * 0.12);
                const g = ctx.createRadialGradient(sc.x, sc.y, 10, sc.x, sc.y, sc.radius);
                g.addColorStop(0, `rgba(235, 245, 255, ${alpha})`);
                g.addColorStop(1, 'rgba(200, 220, 240, 0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(sc.x, sc.y, sc.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 粒子渲染
            for (let i = 0; i < particlePool.active.length; i++) {
                const p = particlePool.active[i];
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            // 浮動傷害數字
            for (let i = 0; i < floatingTextPool.active.length; i++) {
                const ft = floatingTextPool.active[i];
                ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.8));
                ctx.fillStyle = ft.color;
                ctx.font = `bold ${Math.floor(15 * ft.scale)}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1.0;

            ctx.restore();

            // --- 螢幕空間 HUD、Boss 頂部大血條與架勢條 ---
            renderBossBars();
            renderHUD(timestamp);
            renderCrosshair();
            renderWaveAndCombo();
            renderMinimap();
            if (userSettings.showTelemetry) renderTelemetryHUD();
        }

        function renderBossBars() {
            const bosses = enemies.filter(e => e.type === 'boss' && !e.isSpawning);
            if (bosses.length === 0) return;

            bosses.forEach((b, idx) => {
                const barW = bosses.length > 1 ? 380 : 540;
                const bx = bosses.length > 1 ? (WIDTH * 0.5 - 400 + idx * 420) : (WIDTH * 0.5 - 270);
                const by = 74;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
                ctx.fillRect(bx, by, barW, 24);
                ctx.fillStyle = b.hydraDownTimer > 0 ? '#666666' : (b.phase === 3 ? '#9900ff' : (b.phase === 2 ? '#ff00aa' : b.color));
                ctx.fillRect(bx + 2, by + 2, (barW - 4) * Math.max(0, b.hp / b.maxHp), 15);

                // 架勢條 (Stagger Gauge)
                if (b.maxStagger) {
                    ctx.fillStyle = '#332200';
                    ctx.fillRect(bx + 2, by + 18, barW - 4, 4);
                    ctx.fillStyle = b.staggerBrokenTimer > 0 ? '#ffffff' : '#ffcc00';
                    const stgRatio = b.staggerBrokenTimer > 0 ? (b.staggerBrokenTimer / 3.5) : (b.stagger / b.maxStagger);
                    ctx.fillRect(bx + 2, by + 18, (barW - 4) * Math.min(1, stgRatio), 4);
                }

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(bx, by, barW, 24);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                const label = b.hydraDownTimer > 0
                    ? `${b.bossName} [REVIVING IN ${b.hydraDownTimer.toFixed(1)}s]`
                    : `${b.bossName} [P${b.phase}] : ${Math.max(0, Math.ceil(b.hp))} / ${b.maxHp}`;
                ctx.fillText(label, bx + barW * 0.5, by - 5);
            });
        }

        function renderCrosshair() {
            ctx.strokeStyle = player.isOverheated ? '#ff0044' : (player.chargeTimer >= player.chargeMax ? '#ffcc00' : 'rgba(255, 255, 255, 0.88)');
            ctx.lineWidth = player.chargeTimer >= player.chargeMax ? 3.5 : 2;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 10 + (player.chargeTimer * 8), 0, Math.PI * 2);
            ctx.moveTo(mouse.x - 18, mouse.y); ctx.lineTo(mouse.x + 18, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 18); ctx.lineTo(mouse.x, mouse.y + 18);
            ctx.stroke();

            if (player.sp >= player.maxSp && !player.isUltimate) {
                ctx.fillStyle = '#ff00ff';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'left';
                ctx.fillText("[E] OVERDRIVE READY!", mouse.x + 22, mouse.y - 10);
            }
        }

        function renderWaveAndCombo() {
            if (bossFinisherTimer > 0) {
                ctx.fillStyle = 'rgba(6, 10, 18, 0.85)';
                ctx.fillRect(0, HEIGHT / 2 - 70, WIDTH, 140);
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'italic bold 58px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("APEX ENTITY ANNIHILATED", WIDTH / 2, HEIGHT / 2 + 20);
            }

            if (synergyBannerTimer > 0 && lastAwakenedSynergy) {
                const alpha = Math.min(1, synergyBannerTimer);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(8, 12, 24, 0.88)';
                ctx.fillRect(WIDTH / 2 - 340, 115, 680, 74);
                ctx.strokeStyle = lastAwakenedSynergy.color;
                ctx.lineWidth = 3;
                ctx.strokeRect(WIDTH / 2 - 340, 115, 680, 74);
                ctx.fillStyle = lastAwakenedSynergy.color;
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(lastAwakenedSynergy.name, WIDTH / 2, 144);
                ctx.fillStyle = '#e0f2f1';
                ctx.font = '13px Arial';
                ctx.fillText(lastAwakenedSynergy.desc, WIDTH / 2, 170);
                ctx.restore();
            }

            if (waveAnnounceTimer > 0) {
                const s = 1 + waveAnnounceTimer * 0.35;
                ctx.save();
                ctx.translate(WIDTH / 2, HEIGHT / 3);
                ctx.scale(s, s);
                ctx.fillStyle = `rgba(255, 255, 255, ${waveAnnounceTimer / 2.4})`;
                ctx.font = 'bold 52px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`WAVE ${wave}`, 0, 0);
                ctx.restore();
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(`WAVE ${wave}`, WIDTH - 24, 38);
            }

            if (comboCount > 2) {
                const rank = getRank();
                if (rank) {
                    ctx.fillStyle = rank.color;
                    ctx.font = 'italic bold 38px Arial';
                    ctx.textAlign = 'right';
                    ctx.fillText(`${rank.rank}`, WIDTH - 24, 116);
                }
                const maxComboDuration = player.hasPerk('combo_master') ? 8.4 : 4.2;
                const alpha = Math.max(0, Math.min(1, comboTimer / maxComboDuration));

        function playerTakeDamage(amt) {
            if (player.shield > 0) {
                player.shield = Math.max(0, player.shield - amt);
                player.invulnTimer = 0.85;
                chromaticAberration = 0.9;
                triggerHitStop(0.08, 12);
                playSound('hit', { x: player.x });
                spawnFloatingText(player.x, player.y - 30, "SHIELD ABSORBED", "#00d5ff");
                return;
            }
            player.hp -= amt;
            player.invulnTimer = 1.4;
            chromaticAberration = 1.35;
            triggerHitStop(0.12, 22);
            playSound('hit', { x: player.x });
            if (player.hp <= 0) {
                player.hp = 0;
                finalizeRunSave();
                gameState = 'gameover';
            }
        }

        function renderMinimap() {
            const mmSize = 135;
            const mmX = WIDTH - mmSize - 24;
            const mmY = 135;
            ctx.fillStyle = 'rgba(6, 12, 18, 0.78)';
            ctx.fillRect(mmX, mmY, mmSize, mmSize);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.45)';
            ctx.lineWidth = 2;
            ctx.strokeRect(mmX, mmY, mmSize, mmSize);

            const scaleX = mmSize / MAP_WIDTH;
            const scaleY = mmSize / MAP_HEIGHT;

            ctx.fillStyle = 'rgba(120, 140, 160, 0.45)';
            for (let r = 0; r < MAP_ROWS; r++) {
                for (let c = 0; c < MAP_COLS; c++) {
                    if (mapData[r][c] === 1 || mapData[r][c] === 4) {
                        ctx.fillRect(mmX + c * TILE_SIZE * scaleX, mmY + r * TILE_SIZE * scaleY, TILE_SIZE * scaleX + 0.5, TILE_SIZE * scaleY + 0.5);
                    }
                }
            }

            ctx.fillStyle = player.getElementColor();
            ctx.fillRect(mmX + player.x * scaleX - 3, mmY + player.y * scaleY - 3, 6, 6);

            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (e.isSpawning) continue;
                ctx.fillStyle = e.type === 'boss' ? '#ff00ff' : (e.type === 'juggernaut' ? '#00ffff' : '#ff0044');
                ctx.beginPath();
                ctx.arc(mmX + e.x * scaleX, mmY + e.y * scaleY, e.type === 'boss' ? 5 : 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

            const isHover = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
            ctx.save();
            ctx.fillStyle = isHover ? 'rgba(22, 42, 68, 0.96)' : bgColor;
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = isHover ? 3 : 1.8;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = isHover ? '#ffffff' : borderColor;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(label, x + w * 0.5, y + h * 0.5 + fontSize * 0.36);
            ctx.restore();
