            mouse.hoverCardIndex = -1;
            const cardW = 275;
            const cardH = 355;
            const spacing = 32;
            const totalW = offeredPerks.length * cardW + (offeredPerks.length - 1) * spacing;
            const startX = (WIDTH - totalW) / 2;
            const cardY = 180;

            offeredPerks.forEach((p, idx) => {
                const cx = startX + idx * (cardW + spacing);
                const isHover = (mouse.x >= cx && mouse.x <= cx + cardW && mouse.y >= cardY && mouse.y <= cardY + cardH);
                if (isHover) mouse.hoverCardIndex = idx;

                // 檢查此天賦是否能與玩家現有天賦觸發羈絆
                let synergyHint = null;
                for (let s = 0; s < SYNERGY_DATABASE.length; s++) {
                    const syn = SYNERGY_DATABASE[s];
                    if (syn.req[0] === p.id && player.hasPerk(syn.req[1])) synergyHint = syn.name;
                    if (syn.req[1] === p.id && player.hasPerk(syn.req[0])) synergyHint = syn.name;
                }

                const rarityColors = {
                    common: '#00ffcc',
                    rare: '#00aaff',
                    epic: '#c300ff',
                    legendary: '#ffcc00'
                };
                const color = synergyHint ? '#ff00aa' : (rarityColors[p.rarity] || '#00ffcc');

                ctx.save();
                ctx.fillStyle = isHover ? 'rgba(24, 38, 58, 0.96)' : 'rgba(10, 18, 30, 0.88)';
                ctx.strokeStyle = color;
                ctx.lineWidth = isHover || synergyHint ? 3.5 : 2;
                ctx.beginPath();
                ctx.roundRect(cx, cardY - (isHover ? 10 : 0), cardW, cardH, 14);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = color;
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(`[ ${p.rarity.toUpperCase()} ]`, cx + 20, cardY + 34 - (isHover ? 10 : 0));

                ctx.textAlign = 'right';
                ctx.fillText(`KEY [ ${idx + 1} ]`, cx + cardW - 20, cardY + 34 - (isHover ? 10 : 0));

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, cx + cardW / 2, cardY + 82 - (isHover ? 10 : 0));

                ctx.fillStyle = '#b0bec5';
                ctx.font = '15px Arial';
                wrapText(ctx, p.desc, cx + cardW / 2, cardY + 135 - (isHover ? 10 : 0), cardW - 36, 24);

                if (synergyHint) {
                    ctx.fillStyle = '#ff00aa';
                    ctx.font = 'bold 12px Arial';
                    wrapText(ctx, `★ 可觸發羈絆：${synergyHint}`, cx + cardW / 2, cardY + 275 - (isHover ? 10 : 0), cardW - 30, 18);
                }

                ctx.restore();
            });

            drawCyberButton(
                WIDTH / 2 - 130, 585, 260, 45,
                `↻ 重骰天賦 [R] (剩餘: ${perkRerolls})`,
                perkRerolls > 0 ? '#00ffcc' : '#546e7a',
                'rgba(10, 22, 34, 0.9)', 15
            );
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const chars = text.split('');
            let line = '';
            for (let n = 0; n < chars.length; n++) {
                const testLine = line + chars[n];
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = chars[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        function renderGameOverScreen() {
            ctx.fillStyle = 'rgba(3, 6, 12, 0.9)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.fillStyle = '#ff0044';
            ctx.font = 'bold 58px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('CRITICAL CORE FAILURE', WIDTH / 2, 210);

            ctx.fillStyle = '#ffffff';
            ctx.font = '21px Arial';
            ctx.fillText(`生存波數: ${wave}   |   總擊殺數: ${totalKills}`, WIDTH / 2, 290);
            ctx.fillText(`總造成傷害: ${Math.floor(totalDamageDealt)}   |   矩陣等級: ${player.level}`, WIDTH / 2, 330);

            ctx.fillStyle = '#ff00aa';
            ctx.font = 'bold 22px Arial';
            ctx.fillText(`本局獲得矩陣數據碎片: +${runShardsEarned} DATA SHARDS (總計: ${metaSave.shards})`, WIDTH / 2, 385);

            drawCyberButton(WIDTH / 2 - 190, 510, 380, 55, '↻ REBOOT MATRIX [R]', '#00ffcc', 'rgba(0, 45, 40, 0.9)', 19);
            drawCyberButton(WIDTH / 2 - 190, 580, 380, 50, '⌂ RETURN TO GODCORE LAB', '#ff00aa', 'rgba(35, 10, 40, 0.9)', 16);
        }

        // 初始化柔體節點並啟動 3A 遊戲主迴圈
        player.initSoftBody();
        requestAnimationFrame(gameLoop);
    })();
    </script>
</body>
